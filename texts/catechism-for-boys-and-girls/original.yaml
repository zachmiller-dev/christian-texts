Metadata:
  Title: A Catechism for Boys and Girls
  AlternativeTitles: []
  Year: '1998'
  Authors:
  - Errol Hulse
  Location:
  OriginalLanguage: English
  OriginStory: ''
  SourceUrl: https://www.chapellibrary.org/pdf/books/cfba.pdf
  SourceAttribution: Public Domain
  CreedFormat: Catechism
Data:
- Number: 1
  Sections:
  - Section: Question
    Content: Who made you?
  - Section: Answer
    Content: God made me.
  - Section: Proofs
    References:
    - Genesis 1:26–27
    - Genesis 2:7
    - Ecclesiastes 12:1
    - Acts 17:24–29
- Number: 2
  Sections:
  - Section: Question
    Content: What else did God make?
  - Section: Answer
    Content: God made *all* things.
  - Section: Proofs
    References:
    - Genesis 1, esp. vv. 1 and 3
    - Acts 14:15
    - Romans 11:36
    - Colossians 1:16
- Number: 3
  Sections:
  - Section: Question
    Content: Why did God make you and all things?
  - Section: Answer
    Content: For His own glory.
  - Section: Proofs
    References:
    - Psalms 19:1
    - Jeremiah 9:23–24
    - Revelation 4:11
    - Revelation 5:13
- Number: 4
  Sections:
  - Section: Question
    Content: How can you glorify God?
  - Section: Answer
    Content: By loving Him and doing what He commands.
  - Section: Proofs
    References:
    - Ecclesiastes 12:13
    - Mark 12:29–31
    - John 15:8–10
    - 1 Corinthians 10:31
- Number: 5
  Sections:
  - Section: Question
    Content: Why ought you to glorify God?
  - Section: Answer
    Content: Because He made me and takes care of me.
  - Section: Proofs
    References:
    - Romans 11:36
    - Revelation 4:11
    - Daniel 5:23
- Number: 6
  Sections:
  - Section: Question
    Content: Are there more gods than one?
  - Section: Answer
    Content: There is only one God.
  - Section: Proofs
    References:
    - Deuteronomy 6:4
    - Jeremiah 10:10
    - Mark 12:29
    - Acts 17:22–31
- Number: 7
  Sections:
  - Section: Question
    Content: In how many Persons does this one God exist?
  - Section: Answer
    Content: In three Persons.
  - Section: Proofs
    References:
    - Matthew 3:16–17
    - John 5:23
    - John 10:30
    - John 14:9, 10
    - John 15:26
    - John 16:13–15
    - 1 John 5:20
    - 2 John 9
    - Revelation 1:4–5
- Number: 8
  Sections:
  - Section: Question
    Content: Who are they?
  - Section: Answer
    Content: The Father, the Son, and the Holy Spirit.
  - Section: Proofs
    References:
    - Matthew 28:19
    - 2 Corinthians 13:14
    - 1 Peter 1:2
    - Jude 20–21
- Number: 9
  Sections:
  - Section: Question
    Content: Who is God?
  - Section: Answer
    Content: God is a Spirit, and has not a body like men.
  - Section: Proofs
    References:
    - John 4:24
    - 2 Corinthians 3:17
    - 1 Timothy 1:17
- Number: 10
  Sections:
  - Section: Question
    Content: Where is God?
  - Section: Answer
    Content: God is everywhere.
  - Section: Proofs
    References:
    - Psalms 139:7–12
    - Jeremiah 23:23–24
    - Acts 17:27–28
- Number: 11
  Sections:
  - Section: Question
    Content: Can you see God?
  - Section: Answer
    Content: No. I cannot see God, but He always sees me.
  - Section: Proofs
    References:
    - Exodus 33:20
    - John 1:18
    - 1 Timothy 6:16
    - Psalms 139, esp. vv. 1–5
    - Proverbs 5:21
    - Hebrews 4:12–13
- Number: 12
  Sections:
  - Section: Question
    Content: Does God know all things?
  - Section: Answer
    Content: Yes. Nothing can be hidden from God.
  - Section: Proofs
    References:
    - 1 Chronicles 28:9
    - 2 Chronicles 16:9
    - Luke 12:6–7
    - Romans 2:16
- Number: 13
  Sections:
  - Section: Question
    Content: Can God do all things?
  - Section: Answer
    Content: Yes. God can do all His holy will.
  - Section: Proofs
    References:
    - Psalms 147:5
    - Jeremiah 32:17
    - Daniel 4:34–35
    - Ephesians 1:11
- Number: 14
  Sections:
  - Section: Question
    Content: Where do you learn how to love and obey God?
  - Section: Answer
    Content: In the Bible alone.
  - Section: Proofs
    References:
    - Job 11:7
    - Psalms 119:104
    - Isaiah 8:20
    - Matthew 22:29
    - 2 Timothy 3:15–17
- Number: 15
  Sections:
  - Section: Question
    Content: Who wrote the Bible?
  - Section: Answer
    Content: Holy men who were taught by the Holy Spirit.
  - Section: Proofs
    References:
    - 2 Peter 1:20–21
    - Acts 1:16
    - 2 Timothy 3:16
    - 1 Peter 1:10–11
- Number: 16
  Sections:
  - Section: Question
    Content: Who were our first parents?
  - Section: Answer
    Content: Adam and Eve.
  - Section: Proofs
    References:
    - Genesis 2:18–25
    - Genesis 3:20
    - Genesis 5:1–2
    - Acts 17:26
    - 1 Timothy 2:13
- Number: 17
  Sections:
  - Section: Question
    Content: Of what were our first parents made?
  - Section: Answer
    Content: |-
      God made the body of Adam out of the ground, and formed Eve from the body of Adam.
  - Section: Proofs
    References:
    - Genesis 2:7
    - Genesis 21–23
    - Genesis 3:19
    - Psalms 103:14
- Number: 18
  Sections:
  - Section: Question
    Content: What did God give Adam and Eve besides bodies?
  - Section: Answer
    Content: He gave them souls that could never die.
  - Section: Proofs
    References:
    - 1 Corinthians 15:45
    - Ecclesiastes 12:7
    - Zechariah 12:1
- Number: 19
  Sections:
  - Section: Question
    Content: Have you a soul as well as a body?
  - Section: Answer
    Content: Yes. I have a soul that can never die.
  - Section: Proofs
    References:
    - Matthew 10:28
    - Mark 8:34–38
    - Mark 12:30
- Number: 20
  Sections:
  - Section: Question
    Content: How do you know that you have a soul?
  - Section: Answer
    Content: Because the Bible tells me so.
  - Section: Proofs
    References:
    - Matthew 10:28
    - Mark 8:34–38
    - Mark 12:30
- Number: 21
  Sections:
  - Section: Question
    Content: In what condition did God make Adam and Eve?
  - Section: Answer
    Content: He made them holy and happy.
  - Section: Proofs
    References:
    - Genesis 1:26–28
    - Psalms 8:4–8
- Number: 22
  Sections:
  - Section: Question
    Content: Did Adam and Eve stay holy and happy?
  - Section: Answer
    Content: No. They sinned against God.
  - Section: Proofs
    References:
    - Genesis 3:1–7
    - Ecclesiastes 7:29
    - Hosea 6:7 (“men”=Adam)
- Number: 23
  Sections:
  - Section: Question
    Content: What is sin?
  - Section: Answer
    Content: Sin is any transgression of the Law of God.
  - Section: Proofs
    References:
    - 1 John 3:4
    - Romans 3:20
    - James 2:9–11
- Number: 24
  Sections:
  - Section: Question
    Content: What is meant by transgression?
  - Section: Answer
    Content: Doing what God forbids.
  - Section: Proofs
    References:
    - 1 Samuel 13:8–14
    - 1 Samuel 15:22–23
    - Hosea 6:7
    - Romans 1:21–32
- Number: 25
  Sections:
  - Section: Question
    Content: What was the sin of our first parents?
  - Section: Answer
    Content: Eating the forbidden fruit.
  - Section: Proofs
    References:
    - Genesis 2:16–17
    - Genesis 3:6
- Number: 26
  Sections:
  - Section: Question
    Content: Why did they eat the forbidden fruit?
  - Section: Answer
    Content: Because they did not believe what God had said.
  - Section: Proofs
    References:
    - Genesis 3:1–6
    - compare Hebrews 11:6
- Number: 27
  Sections:
  - Section: Question
    Content: Who tempted them to this sin?
  - Section: Answer
    Content: The devil tempted Eve, and she gave the fruit to Adam.
  - Section: Proofs
    References:
    - Genesis 3:1–13
    - 2 Corinthians 11:3
    - 1 Timothy 2:13–14
    - compare Revelation 12:9
- Number: 28
  Sections:
  - Section: Question
    Content: What happened to our first parents when they had sinned?
  - Section: Answer
    Content: Instead of being holy and happy, they became sinful and miserable.
  - Section: Proofs
    References:
    - Genesis 3:14–24
    - Genesis 4:1–24
    - James 1:14–15
- Number: 29
  Sections:
  - Section: Question
    Content: What effect had the sin of Adam on all mankind?
  - Section: Answer
    Content: All mankind is born in a state of sin and misery.
  - Section: Proofs
    References:
    - Psalms 51:5
    - Romans 5:12, 18–19
    - 1 Corinthians 15:21–22
    - 1 John 5:19
- Number: 30
  Sections:
  - Section: Question
    Content: What do we inherit from Adam as a result of this original sin?
  - Section: Answer
    Content: A sinful nature.
  - Section: Proofs
    References:
    - 1 Kings 8:46
    - Psalms 14:2, 3
    - Psalms 58:3
    - Ecclesiastes 9:3
    - Matthew 15:18–20
    - John 2:24–25
    - Romans 8:7
- Number: 31
  Sections:
  - Section: Question
    Content: What does every sin deserve?
  - Section: Answer
    Content: The anger and judgment of God.
  - Section: Proofs
    References:
    - Deuteronomy 27:26
    - Romans 1:18
    - Romans 2:2
    - Galatians 3:10
    - Ephesians 5:6
- Number: 32
  Sections:
  - Section: Question
    Content: Can anyone go to heaven with this sinful nature?
  - Section: Answer
    Content: No. Our hearts must be changed before we can be fit for heaven.
  - Section: Proofs
    References:
    - Jeremiah 31:33–34
    - Ezekiel 36:25–27
    - John 1:12–13
    - John 3:1–10
    - 1 John 5:1, 4, 18
- Number: 33
  Sections:
  - Section: Question
    Content: What is a change of heart called?
  - Section: Answer
    Content: Regeneration.
  - Section: Proofs
    References:
    - Titus 3:5–7
- Number: 34
  Sections:
  - Section: Question
    Content: Who can change a sinner’s heart?
  - Section: Answer
    Content: The Holy Spirit alone.
  - Section: Proofs
    References:
    - John 3:3
    - Romans 8:6–11
    - 1 Corinthians 2:9–14
    - 2 Thessalonians 2:13–14
    - Titus 3:5–6
- Number: 35
  Sections:
  - Section: Question
    Content: What is righteousness?
  - Section: Answer
    Content: It is God's goodness.
  - Section: Proofs
    References:
    - Exodus 33:19
    - Exodus 34:6
    - Psalms 33:5
    - Hosea 3:5
    - Romans 11:22
- Number: 36
  Sections:
  - Section: Question
    Content: Can anyone be saved by his own righteousness?
  - Section: Answer
    Content: No. No one is good enough for God.
  - Section: Proofs
    References:
    - Proverbs 20:9
    - Ecclesiastes 7:20
    - Romans 3:10–23
- Number: 37
  Sections:
  - Section: Question
    Content: What is a covenant?
  - Section: Answer
    Content: An agreement between two or more persons.
  - Section: Proofs
    References:
    - For example 1 Samuel 18:3
    - Matthew 26:14–15
- Number: 38
  Sections:
  - Section: Question
    Content: What is the covenant of grace?
  - Section: Answer
    Content: |-
      The agreement God the Father made with Christ concerning His elect people, to save them from their sins.
  - Section: Proofs
    References:
    - Psalms 2:7–8
    - Psalms 40:6–8
    - Psalms 89:3–4
    - John 6:37–39
    - John 17:6
    - Hebrews 13:20
    - Titus 1:2
    - 2 Timothy 1:9
    - Ephesians 3:11
- Number: 39
  Sections:
  - Section: Question
    Content: What did Christ undertake in the covenant of grace?
  - Section: Answer
    Content: |-
      To keep the whole Law for His people, and to suffer the punishment due to their sins.
  - Section: Proofs
    References:
    - Romans 8:3–4
    - Galatians 4:4–5
    - Hebrews 9:14–15
- Number: 40
  Sections:
  - Section: Question
    Content: Did our Lord Jesus Christ ever sin?
  - Section: Answer
    Content: No. He was holy, blameless, and undefiled.
  - Section: Proofs
    References:
    - Luke 23:47
    - Hebrews 7:26
    - Hebrews 4:15
    - 1 Peter 2:22
    - 1 John 3:5
- Number: 41
  Sections:
  - Section: Question
    Content: How could the Son of God suffer?
  - Section: Answer
    Content: |-
      Christ, the Son of God, took flesh and blood—that He might obey and suffer as a man.
  - Section: Proofs
    References:
    - John 1:14
    - Romans 8:3
    - Galatians 4:4
    - Philippians 2:7–8
    - Hebrews 2:14, 17
    - Hebrews 4:15
- Number: 42
  Sections:
  - Section: Question
    Content: What is meant by the atonement?
  - Section: Answer
    Content: |-
      Christ satisfying divine justice, by His sufferings and death, in the place of sinners.
  - Section: Proofs
    References:
    - Mark 10:45
    - Acts 13:38–39
    - Romans 3:24–26
    - Romans 5:8–9
    - 2 Corinthians 5:19–21
    - Galatians 3:13
    - 1 Peter 3:18
- Number: 43
  Sections:
  - Section: Question
    Content: What did God the Father undertake in the covenant of grace?
  - Section: Answer
    Content: To justify and sanctify those for whom Christ should die.
  - Section: Proofs
    References:
    - Romans 8:29–33
    - Hebrews 10:9–10
    - 1 Corinthians 1:8–9
    - Philippians 1:6
    - 1 Thessalonians 4:3, 7
- Number: 44
  Sections:
  - Section: Question
    Content: What is justification?
  - Section: Answer
    Content: It is God regarding sinners as if they had never sinned.
  - Section: Proofs
    References:
    - Zechariah 3:1–5
    - Romans 3:24–26
    - Romans 4:5
    - Romans 8:33
    - 2 Corinthians 5:21
    - Hebrews 8:12
- Number: 45
  Sections:
  - Section: Question
    Content: What is sanctification?
  - Section: Answer
    Content: It is God making sinners holy in heart and conduct.
  - Section: Proofs
    References:
    - John 17:17
    - Ephesians 2:10
    - Ephesians 4:22–24
    - Philippians 2:12–13
    - 1 Thessalonians 5:23
- Number: 46
  Sections:
  - Section: Question
    Content: For whom did Christ obey and suffer?
  - Section: Answer
    Content: For those whom the Father had given Him.
  - Section: Proofs
    References:
    - Isaiah 53:8
    - Matthew 1:21
    - John 10:11, 15–16, 26–29
    - John 17:9
    - Hebrews 2:13
- Number: 47
  Sections:
  - Section: Question
    Content: What kind of life did Christ live on earth?
  - Section: Answer
    Content: A life of perfect obedience to the Law of God.
  - Section: Proofs
    References:
    - Matthew 5:17
    - Romans 10:4
    - 1 Peter 2:21–22
- Number: 48
  Sections:
  - Section: Question
    Content: What kind of death did Christ die?
  - Section: Answer
    Content: The painful and shameful death of the Cross.
  - Section: Proofs
    References:
    - Psalms 22
    - Isaiah 53
    - the Gospel records
- Number: 49
  Sections:
  - Section: Question
    Content: Who will be saved?
  - Section: Answer
    Content: Only those who repent of sin and believe in Christ.
  - Section: Proofs
    References:
    - Mark 1:15
    - Luke 13:3, 5
    - Acts 2:37–41
    - Acts 16:30–31
    - Acts 20:21
    - Acts 26:20
- Number: 50
  Sections:
  - Section: Question
    Content: What is it to repent?
  - Section: Answer
    Content: |-
      To be sorry for sin and to hate and forsake it, because it is displeasing to God.
  - Section: Proofs
    References:
    - Luke 19:8–10
    - Romans 6:1–2
    - 2 Corinthians 7:9–11
    - 1 Thessalonians 1:9–10
- Number: 51
  Sections:
  - Section: Question
    Content: What is it to believe in Christ?
  - Section: Answer
    Content: To trust in Christ alone for salvation.
  - Section: Proofs
    References:
    - John 14:6
    - Acts 4:12
    - 1 Timothy 2:5
    - 1 John 5:11–12
- Number: 52
  Sections:
  - Section: Question
    Content: Can you repent and believe in Christ by your own power?
  - Section: Answer
    Content: No. I can do nothing good without God's Holy Spirit.
  - Section: Proofs
    References:
    - John 3:5–6
    - John 6:44
    - Romans 8:2, 5, 8–11
    - 1 Corinthians 2:9–14
    - Galatians 5:17–18
    - Ephesians 2:4–6
- Number: 53
  Sections:
  - Section: Question
    Content: How can you receive the Holy Spirit?
  - Section: Answer
    Content: God has told us that we must pray to Him for the Holy Spirit.
  - Section: Proofs
    References:
    - Luke 11:9–13
    - John 4:10
    - John 16:24
- Number: 54
  Sections:
  - Section: Question
    Content: How were godly persons saved before the coming of Christ?
  - Section: Answer
    Content: By believing in the Saviour to come.
  - Section: Proofs
    References:
    - John 8:56
    - Galatians 3:8–9
    - 1 Corinthians 10:1–4
    - Hebrews 9:15
    - Hebrews 11:13
- Number: 55
  Sections:
  - Section: Question
    Content: How did they show their faith?
  - Section: Answer
    Content: By offering sacrifices on God's altar.
  - Section: Proofs
    References:
    - Exodus 24:3–8
    - 1 Chronicles 29:20–25
    - Hebrews 9:19–23
    - Hebrews 10:1
    - Hebrews 11:28
- Number: 56
  Sections:
  - Section: Question
    Content: What did these sacrifices represent?
  - Section: Answer
    Content: Christ, the Lamb of God, Who was to die for sinners.
  - Section: Proofs
    References:
    - Exodus 12:46 (compare John 19:36)
    - Hebrews 9 and 10
    - John 1:29
    - 1 Corinthians 5:7
    - 1 Peter 1:19
- Number: 57
  Sections:
  - Section: Question
    Content: What does Christ do for His people?
  - Section: Answer
    Content: He does the work of a prophet, a priest, and a king.
  - Section: Proofs
    References:
    - Hebrews 1:1–3
    - Hebrews 5:5–10
    - Revelation 1:5
    - Matthew 13:57
    - John 18:37
- Number: 58
  Sections:
  - Section: Question
    Content: Why is Christ a prophet?
  - Section: Answer
    Content: Because He teaches us the will of God.
  - Section: Proofs
    References:
    - Deuteronomy 18:15, 18
    - John 1:18
    - John 4:25
    - John 14:23–24
    - 1 John 5:20
- Number: 59
  Sections:
  - Section: Question
    Content: Why is Christ a priest?
  - Section: Answer
    Content: Because He died for our sins and prays to God for us.
  - Section: Proofs
    References:
    - Psalms 110:4
    - 1 Timothy 2:5–6
    - Hebrews 4:14–16
    - Hebrews 7:24–25
    - 1 John 2:1–2
- Number: 60
  Sections:
  - Section: Question
    Content: Why is Christ a king?
  - Section: Answer
    Content: Because He rules over us and defends us.
  - Section: Proofs
    References:
    - Psalms 2:6–9
    - Matthew 28:18–20
    - Ephesians 1:19–23
    - Colossians 1:13, 18
    - Revelation 15:3–4
- Number: 61
  Sections:
  - Section: Question
    Content: Why do you need Christ as a prophet?
  - Section: Answer
    Content: Because I am ignorant.
  - Section: Proofs
    References:
    - Job 11:7
    - Matthew 11:25–27
    - John 6:67–69
    - John 17:25–26
    - 1 Corinthians 2:14–16
    - 2 Corinthians 4:3–6
- Number: 62
  Sections:
  - Section: Question
    Content: Why do you need Christ as a priest?
  - Section: Answer
    Content: Because I am guilty.
  - Section: Proofs
    References:
    - Proverbs 20:9
    - Ecclesiastes 7:20
    - Romans 3:19–23
    - Hebrews 10:14, 27–28
    - 1 John 1:8–9
- Number: 63
  Sections:
  - Section: Question
    Content: Why do you need Christ as a king?
  - Section: Answer
    Content: Because I am weak and helpless.
  - Section: Proofs
    References:
    - John 15:4–5
    - 2 Corinthians 12:9
    - Philippians 4:13
    - Colossians 1:11
    - Jude 24–25
- Number: 64
  Sections:
  - Section: Question
    Content: How many commandments did God give on Mount Sinai?
  - Section: Answer
    Content: Ten commandments.
  - Section: Proofs
    References:
    - Exodus 20:1–17
    - Deuteronomy 5:1–22
- Number: 65
  Sections:
  - Section: Question
    Content: What are the Ten Commandments sometimes called?
  - Section: Answer
    Content: God's moral Law.
  - Section: Proofs
    References:
    - Matthew 19:17–19
    - Romans 2:14–15
    - Romans 10:5
- Number: 66
  Sections:
  - Section: Question
    Content: What do the first four commandments teach?
  - Section: Answer
    Content: Our duty to God.
  - Section: Proofs
    References:
    - Deuteronomy 6:5–6
    - Deuteronomy 10:12–13
- Number: 67
  Sections:
  - Section: Question
    Content: What do the last six commandments teach?
  - Section: Answer
    Content: Our duty to our fellow men.
  - Section: Proofs
    References:
    - Deuteronomy 10:19
    - Micah 6:8
    - compare Galatians 6:10
- Number: 68
  Sections:
  - Section: Question
    Content: What is the sum of the Ten Commandments?
  - Section: Answer
    Content: To love God with all my heart, and my neighbour as myself.
  - Section: Proofs
    References:
    - Deuteronomy 6:1–15
    - Deuteronomy 11:1
    - Matthew 22:35–40
    - James 2:8
- Number: 69
  Sections:
  - Section: Question
    Content: Who is your neighbour?
  - Section: Answer
    Content: All my fellow men are my neighbours.
  - Section: Proofs
    References:
    - Luke 10:25–37
    - Luke 6:35
- Number: 70
  Sections:
  - Section: Question
    Content: Is God pleased with those who love and obey Him?
  - Section: Answer
    Content: Yes. He says, "I love them that love me."
  - Section: Proofs
    References:
    - Proverbs 8:17
    - Exodus 20:6
- Number: 71
  Sections:
  - Section: Question
    Content: Is God pleased with those who do not love and obey Him?
  - Section: Answer
    Content: No. God is angry with the wicked every day.
  - Section: Proofs
    References:
    - Psalms 7:11
    - Malachi 2:17
    - Proverbs 6:16–19
- Number: 72
  Sections:
  - Section: Question
    Content: What is the First Commandment?
  - Section: Answer
    Content: The First Commandment is, "Thou shalt have no other gods before me."
  - Section: Proofs
    References:
    - Exodus 20:3
    - Deuteronomy 5:7
- Number: 73
  Sections:
  - Section: Question
    Content: What does the First Commandment teach us?
  - Section: Answer
    Content: To worship God only.
  - Section: Proofs
    References:
    - Isaiah 45:5–6
    - Matthew 4:10
    - Revelation 22:8–9
- Number: 74
  Sections:
  - Section: Question
    Content: What is the Second Commandment?
  - Section: Answer
    Content: |-
      The Second Commandment is, "Thou shalt not make unto thee any graven image, or any likeness of anything that is in heaven above, or that is in the earth beneath, or that is in the water under the earth: thou shalt not bow down thyself to them, nor serve them: for I, the LORD thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me; and showing mercy unto thousands of them that love me, and keep my commandments."
  - Section: Proofs
    References:
