- Number: 17
  Question: What is sin?
  Answer: Sin is any want of conformity unto, or transgression of, the law of God.
  AnswerWithProofs: Sin is any want of conformity unto, or transgression of, the law of God.
  Proofs:
  - Id: 1
    References:
    - 1 John 3:4
- Number: 18
  Question: What was the sin whereby our first parents fell from the estate wherein they were created?
  Answer: |-
    The sin whereby our first parents fell from the estate wherein they were created, was their eating the forbidden fruit.
  AnswerWithProofs: |-
    The sin whereby our first parents fell from the estate wherein they were created, was their eating the forbidden fruit.
  Proofs:
  - Id: 1
    References:
    - Genesis 3:6, 12, 16–17
- Number: 19
  Question: Did all mankind fall in Adam's first transgression?
  Answer: |-
    The covenant being made with Adam, not only for himself but for his posterity, all mankind descending from him by ordinary generation sinned in him, and fell with him in his first transgression.
  AnswerWithProofs: |-
    The covenant being made with Adam, not only for himself but for his posterity, all mankind descending from him by ordinary generation sinned in him, and fell with him in his first transgression.
