Metadata:
  Title: The Baptist Catechism
  AlternativeTitles: []
  Year: '1693'
  Authors:
  - Benjamin Keach
  - William Collins
  Location:
  OriginalLanguage: English
  OriginStory: ''
  SourceUrl: https://1689.com/catechism
  SourceAttribution: Public Domain
  CreedFormat: Catechism
Data:
- Number: 1
  Sections:
  - Section: Question
    Content: Who is the first and chiefest being?
  - Section: Answer
    Content: God is the first and chiefest being.
  - Section: Proofs
    References:
    - Isaiah 44:6
    - Isaiah 48:12
    - Psalms 97:9
- Number: 2
  Sections:
  - Section: Question
    Content: Ought everyone to believe there is a God?
  - Section: Answer
    Content: |-
      Everyone ought to believe there is a God; and it is their great sin and folly who do not.
  - Section: Proofs
    References:
    - Hebrews 11:6
    - Psalms 14:1
- Number: 3
  Sections:
  - Section: Question
    Content: How may we know there is a God?
  - Section: Answer
    Content: |-
      The light of nature in man and the works of God plainly declare there is a God; but His Word and Spirit only do it fully and effectually for the salvation of sinners.
  - Section: Proofs
    References:
    - Romans 1:19–20
    - Psalms 19:1–3
    - Acts 17:24
    - 1 Corinthians 2:10
    - 2 Timothy 3:15–16
- Number: 4
  Sections:
  - Section: Question
    Content: What is the Word of God?
  - Section: Answer
    Content: |-
      The holy Scriptures of the Old and New Testament are the Word of God, and the only certain rule of faith and obedience.
  - Section: Proofs
    References:
    - 2 Timothy 3:16
    - Ephesians 2:20
- Number: 5
  Sections:
  - Section: Question
    Content: May all men make use of the holy Scriptures?
  - Section: Answer
    Content: |-
      All men are not only permitted, but commanded and exhorted to read, hear, and understand the holy Scriptures.
  - Section: Proofs
    References:
    - John 5:38
    - John 17:17–18
    - Revelation 1:3
    - Acts 8:30
- Number: 6
  Sections:
  - Section: Question
    Content: What things are chiefly contained in the holy Scriptures?
  - Section: Answer
    Content: |-
      The holy Scriptures chiefly contain what man ought to believe concerning God, and what duty God requireth of man.
  - Section: Proofs
    References:
    - 2 Timothy 1:13
    - 2 Timothy 3:15–16
- Number: 7
  Sections:
  - Section: Question
    Content: What is God?
  - Section: Answer
    Content: |-
      God is a Spirit, infinite, eternal, and unchangeable in His being, wisdom, power, holiness, justice, goodness, and truth.
  - Section: Proofs
    References:
    - John 4:24
    - Job 11:7–9
    - Psalms 110:2
    - James 1:17
    - Exodus 3:14
    - Psalms 147:5
    - Revelation 4:8
    - Revelation 15:4
    - Exodus 34:6
- Number: 8
  Sections:
  - Section: Question
    Content: Are there more gods than one?
  - Section: Answer
    Content: There is but one only, the living and true God.
  - Section: Proofs
    References:
    - Deuteronomy 6:4
    - Jeremiah 10:10
- Number: 9
  Sections:
  - Section: Question
    Content: How many persons are there in the Godhead?
  - Section: Answer
    Content: |-
      There are three persons in the Godhead, the Father, the Son, and the Holy Spirit; and these three are one God, the same in essence, equal in power and glory.
  - Section: Proofs
    References:
    - 1 John 5:7
    - Matthew 28:19
- Number: 10
  Sections:
  - Section: Question
    Content: What are the decrees of God?
  - Section: Answer
    Content: |-
      The decrees of God are His eternal purpose according to the counsel of His will, whereby, for His own glory, He hath foreordained whatsoever comes to pass.
  - Section: Proofs
    References:
    - Ephesians 1:4, 11
    - Romans 9:22–23
    - Isaiah 46:10
    - Lamentations 3:37
- Number: 11
  Sections:
  - Section: Question
    Content: How doth God execute His decrees?
  - Section: Answer
    Content: God executeth his decrees in the works of creation and providence.
- Number: 12
  Sections:
  - Section: Question
    Content: What is the work of creation?
  - Section: Answer
    Content: |-
      The work of creation is God's making all things of nothing, by the word of His power, in the space of six days, and all very good.
  - Section: Proofs
    References:
    - Genesis 1:1–31
    - Hebrews 11:3
- Number: 13
  Sections:
  - Section: Question
    Content: How did God create man?
  - Section: Answer
    Content: |-
      God created man, male and female, after His own image, in knowledge, righteousness, and holiness, with dominion over the creature.
  - Section: Proofs
    References:
    - Genesis 1:26–28
    - Colossians 3:10
    - Ephesians 4:24
- Number: 14
  Sections:
  - Section: Question
    Content: What are God's works of providence?
  - Section: Answer
    Content: |-
      God's works of providence are His most holy, wise, and powerful preserving and governing all His creatures, and all their actions.
  - Section: Proofs
    References:
    - Psalms 145:17
    - Isaiah 28:29
    - Psalms 104:24
    - Hebrews 1:3
    - Psalms 103:19
    - Matthew 10:29–31
- Number: 15
  Sections:
  - Section: Question
    Content: |-
      What special act of providence did God exercise towards man in the estate wherein he was created?
  - Section: Answer
    Content: |-
      When God had created man, He entered into a covenant of life with him upon condition of perfect obedience; forbidding him to eat of the tree of the knowledge of good and evil, upon pain of death.
  - Section: Proofs
    References:
    - Galatians 3:12
    - Genesis 2:17
- Number: 16
  Sections:
  - Section: Question
    Content: Did our first parents continue in the estate wherein they were created?
  - Section: Answer
    Content: |-
      Our first parents, being left to the freedom of their own will, fell from the estate wherein they were created by sinning against God.
  - Section: Proofs
    References:
    - Genesis 3:6–8, 13
    - Ecclesiastes 7:29
- Number: 17
  Sections:
  - Section: Question
    Content: What is sin?
  - Section: Answer
    Content: Sin is any want of conformity unto, or transgression of, the law of God.
  - Section: Proofs
    References:
    - 1 John 3:4
- Number: 18
  Sections:
  - Section: Question
    Content: |-
      What was the sin whereby our first parents fell from the estate wherein they were created?
  - Section: Answer
    Content: |-
      The sin whereby our first parents fell from the estate wherein they were created, was their eating the forbidden fruit.
  - Section: Proofs
    References:
    - Genesis 3:6, 12, 16–17
- Number: 19
  Sections:
  - Section: Question
    Content: Did all mankind fall in Adam's first transgression?
  - Section: Answer
    Content: |-
      The covenant being made with Adam, not only for himself but for his posterity, all mankind descending from him by ordinary generation sinned in him, and fell with him in his first transgression.
  - Section: Proofs
    References:
    - Genesis 2:16–17
    - Romans 5:12
    - 1 Corinthians 15:21–22
- Number: 20
  Sections:
  - Section: Question
    Content: Into what estate did the Fall bring mankind?
  - Section: Answer
    Content: The Fall brought mankind into an estate of sin and misery.
  - Section: Proofs
    References:
    - Romans 5:12
- Number: 21
  Sections:
  - Section: Question
    Content: Wherein consists the sinfulness of that estate whereinto man fell?
  - Section: Answer
    Content: |-
      The sinfulness of that estate whereinto man fell, consists in the guilt of Adam's first sin, the want of original righteousness, and the corruption of his whole nature, which is commonly called original sin; together with all actual transgressions which proceed from it.
  - Section: Proofs
    References:
    - Romans 5:12
    - Ephesians 2:1–3
    - James 1:14–15
    - Matthew 15:19
- Number: 22
  Sections:
  - Section: Question
    Content: What is the misery of that estate whereinto man fell?
  - Section: Answer
    Content: |-
      All mankind by their fall lost communion with God, are under His wrath and curse, and so made liable to all miseries in this life, to death itself, and to the pains of hell for ever.
  - Section: Proofs
    References:
    - Genesis 3:8, 10, 24
    - Ephesians 2:2–3
    - Galatians 3:10
    - Lamentations 3:39
    - Romans 6:23
    - Matthew 25:41, 46
- Number: 23
  Sections:
  - Section: Question
    Content: Did God leave all mankind to perish in the estate of sin and misery?
  - Section: Answer
    Content: |-
      God having out of His mere good pleasure, from all eternity, elected some to everlasting life, did enter into a Covenant of Grace, to deliver them out of the estate of sin and misery, and to bring them into an estate of salvation by a Redeemer.
  - Section: Proofs
    References:
    - Ephesians 1:4–5
    - Romans 3:20–22
    - Galatians 3:21–22
- Number: 24
  Sections:
  - Section: Question
    Content: Who is the Redeemer of God's elect?
  - Section: Answer
    Content: |-
      The only Redeemer of God's elect is the Lord Jesus Christ; Who, being the eternal Son of God, became man, and so was and continueth to be God and man in two distinct natures, and one person for ever.
  - Section: Proofs
    References:
    - 1 Timothy 2:5–6
    - John 1:14
    - Galatians 4:4
    - Romans 9:5
    - Luke 1:35
    - Colossians 2:9
    - Hebrews 7:24–25
- Number: 25
  Sections:
  - Section: Question
    Content: How did Christ, being the Son of God become man?
  - Section: Answer
    Content: |-
      Christ the Son of God became man by taking to Himself a true body, and a reasonable soul; being conceived by the power of the Holy Spirit in the womb of the Virgin Mary, and born of her, yet without sin.
  - Section: Proofs
    References:
    - Hebrews 2:14, 17
    - Hebrews 10:5
    - Matthew 26:38
    - Luke 1:27, 31, 34–35, 42
    - Galatians 4:4
    - Hebrews 4:15
    - Hebrews 7:26
- Number: 26
  Sections:
  - Section: Question
    Content: What offices doth Christ execute as our Redeemer?
  - Section: Answer
    Content: |-
      Christ as our Redeemer executeth the offices of a prophet, of a priest, and of king, both in His estate of humiliation and exaltation.
  - Section: Proofs
    References:
    - Acts 3:22
    - Hebrews 12:25
    - 2 Corinthians 13:3
    - Hebrews 5:5–7
    - Hebrews 7:25
    - Psalms 2:6
    - Isaiah 9:6–7
    - Matthew 21:5
    - Psalms 2:8–11
- Number: 27
  Sections:
  - Section: Question
    Content: How doth Christ execute the office of a prophet?
  - Section: Answer
    Content: |-
      Christ executeth the office of prophet in revealing to us, by His Word and Spirit, the will of God for our salvation.
  - Section: Proofs
    References:
    - John 1:18
    - 1 Peter 1:10–12
    - John 15:15
    - John 20:31
- Number: 28
  Sections:
  - Section: Question
    Content: How doth Christ execute the office of a priest?
  - Section: Answer
    Content: |-
      Christ executeth the office of priest in His once offering up Himself a sacrifice to satisfy divine justice and reconcile us to God, and in making continual intercession for us.
  - Section: Proofs
    References:
    - Hebrews 9:14, 28
    - Hebrews 2:17
    - Hebrews 7:24–25
- Number: 29
  Sections:
  - Section: Question
    Content: How doth Christ execute the office of king?
  - Section: Answer
    Content: |-
      Christ executeth the office of a king, in subduing us to Himself, in ruling, and defending us, and in restraining and conquering all His and our enemies.
  - Section: Proofs
    References:
    - Acts 15:14–16
    - Isaiah 33:22
    - Isaiah 32:1–2
    - 1 Corinthians 15:25
    - Psalms 110:1–7
- Number: 30
  Sections:
  - Section: Question
    Content: Wherein did Christ's humiliation consist?
  - Section: Answer
    Content: |-
      Christ's humiliation consisted in His being born, and that in a low condition, made under the law, undergoing the miseries of this life, the wrath of God, and the cursed death of the cross; in being buried, and continuing under the power of death for a time.
  - Section: Proofs
    References:
    - Luke 2:7
    - Galatians 4:4
    - Hebrews 12:2–3
    - Isaiah 53:2–3
    - Luke 22:44
    - Matthew 27:46
    - Philippians 2:8
    - 1 Corinthians 15:3–4
    - Acts 2:24–27, 31
    - Matthew 12:40
- Number: 31
  Sections:
  - Section: Question
    Content: Wherein consisteth Christ's exaltation?
  - Section: Answer
    Content: |-
      Christ's exaltation consisteth in His rising again from the dead on the third day, in ascending up into heaven, in sitting at the right hand of God the Father, and in coming to judge the world at the last day.
  - Section: Proofs
    References:
    - 1 Corinthians 15:4
    - Mark 16:19
    - Ephesians 1:20
    - Acts 1:11
    - Acts 17:31
- Number: 32
  Sections:
  - Section: Question
    Content: How are we made partakers of the redemption purchased by Christ?
  - Section: Answer
    Content: |-
      We are made partakers of the redemption purchased by Christ, by the effectual application of it to us by His Holy Spirit.
  - Section: Proofs
    References:
    - John 1:11–12
    - Titus 3:5–6
- Number: 33
  Sections:
  - Section: Question
    Content: How doth the spirit apply to us the redemption purchased by Christ?
  - Section: Answer
    Content: |-
      The Spirit applieth to us the redemption purchased by Christ, by working faith in us, and thereby uniting us to Christ, in our effectual calling.
  - Section: Proofs
    References:
    - Ephesians 1:13–14
    - John 6:37, 39
    - Ephesians 2:8
    - Ephesians 3:17
    - 1 Corinthians 1:9
- Number: 34
  Sections:
  - Section: Question
    Content: What is effectual calling?
  - Section: Answer
    Content: |-
      Effectual calling is the work of God's Spirit, whereby convincing us of our sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He doth persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.
  - Section: Proofs
    References:
    - 2 Timothy 1:9
    - 2 Thessalonians 2:13–14
    - Acts 2:37
    - Acts 26:18
    - Ezekiel 36:26–27
    - John 6:44–45
    - Philippians 2:13
- Number: 35
  Sections:
  - Section: Question
    Content: What benefits do they that are effectually called partake of in this life?
  - Section: Answer
    Content: |-
      They that are effectually called do in this life partake of justification, adoption, sanctification, and the several benefits which in this life do either accompany or flow from them.
  - Section: Proofs
    References:
    - Romans 8:30
    - Ephesians 1:5
    - 1 Corinthians 1:30
- Number: 36
  Sections:
  - Section: Question
    Content: What is justification?
  - Section: Answer
    Content: |-
      Justification is an act of God's free grace, wherein He pardoneth all our sins, and accepteth us as righteous in His sight, only for the righteousness of Christ imputed to us, and received by faith alone.
  - Section: Proofs
    References:
    - Romans 3:24–25
    - Romans 4:6–8
    - 2 Corinthians 5:19, 21
    - Romans 5:17–19
    - Galatians 2:16
    - Philippians 3:9
- Number: 37
  Sections:
  - Section: Question
    Content: What is adoption?
  - Section: Answer
    Content: |-
      Adoption is an act of God's free grace, whereby we are received into the number and have a right to all the privileges of the sons of God.
  - Section: Proofs
    References:
    - 1 John 3:1
    - John 1:12
    - Romans 8:14–17
- Number: 38
  Sections:
  - Section: Question
    Content: What is sanctification?
  - Section: Answer
    Content: |-
      Sanctification is the work of God's free grace, whereby we are renewed in the whole man after the image of God, and are enabled more and more to die unto sin, and live unto righteousness.
  - Section: Proofs
    References:
    - 2 Thessalonians 2:13
    - Ephesians 4:23–24
    - Romans 6:4, 6
    - Romans 8:1
- Number: 39
  Sections:
  - Section: Question
    Content: |-
      What are the benefits which in this life do accompany or flow from justification, adoption, and sanctification?
  - Section: Answer
    Content: |-
      The benefits which in this life do accompany or flow from justification, adoption, and sanctification, are assurance of God's love, peace of conscience, joy in the Holy Spirit, increase of grace, and perseverance therein to the end.
  - Section: Proofs
    References:
    - Romans 5:1–2, 5
    - Romans 5:5, 17
    - Proverbs 4:18
    - 1 John 5:13
    - 1 Peter 1:5
- Number: 40
  Sections:
  - Section: Question
    Content: What benefits do believers receive from Christ at their death?
  - Section: Answer
    Content: |-
      The souls of believers are at their death made perfect in holiness, and do immediately pass into glory; and their bodies being still united to Christ, do rest in their graves till the resurrection.
  - Section: Proofs
    References:
    - Hebrews 12:23
    - 2 Corinthians 5:1, 6, 8
    - Philippians 1:23
    - Luke 23:43
    - 1 Thessalonians 4:14
    - Isaiah 57:2
    - Job 19:26–27
- Number: 41
  Sections:
  - Section: Question
    Content: What benefits do believers receive from Christ at the resurrection?
  - Section: Answer
    Content: |-
      At the resurrection believers, being raised up in glory, shall be openly acknowledged, and acquitted in the day of judgment, and made perfectly blessed, both in soul and body, in the full enjoyment of God to all eternity.
  - Section: Proofs
    References:
    - 1 Corinthians 15:43
    - Matthew 25:23
    - Matthew 10:32
    - 1 John 3:2
    - 1 Corinthians 13:12
    - 1 Thessalonians 4:17–18
- Number: 42
  Sections:
  - Section: Question
    Content: But what shall be done to the wicked at their death?
  - Section: Answer
    Content: |-
      The souls of the wicked shall, at their death, be cast into the torments of hell, and their bodies lie in their graves, till the resurrection and judgment of the great day.
  - Section: Proofs
    References:
    - Luke 16:23–24
    - Acts 2:24
    - Bible — Jude 5
    - Bible — Jude 7
    - 1 Peter 3:19
    - Psalms 49:14
- Number: 43
  Sections:
  - Section: Question
    Content: What shall be done to the wicked, at the day of judgment?
  - Section: Answer
    Content: |-
      At the day of judgment the bodies of the wicked, being raised out of their graves, shall be sentenced, together with their souls, to unspeakable torments with the devil and his angels for ever.
  - Section: Proofs
    References:
    - John 5:28–29
    - Matthew 25:41, 46
    - 2 Thessalonians 1:8–9
- Number: 44
  Sections:
  - Section: Question
    Content: What is the duty which God requireth of man?
  - Section: Answer
    Content: The duty which God requireth of man is, obedience to His revealed will.
  - Section: Proofs
    References:
    - Micah 6:8
    - 1 Samuel 15:22
- Number: 45
  Sections:
  - Section: Question
    Content: What did God at first reveal to man for the rule of his obedience?
  - Section: Answer
    Content: |-
      The rule which God at first revealed to man for his obedience, was the moral law.
  - Section: Proofs
    References:
    - Romans 2:14–15
    - 10:5
- Number: 46
  Sections:
  - Section: Question
    Content: Where is the moral law summarily comprehended?
  - Section: Answer
    Content: The moral law is summarily comprehended in the Ten Commandments.
  - Section: Proofs
    References:
    - Deuteronomy 10:4
    - Matthew 19:17
- Number: 47
  Sections:
  - Section: Question
    Content: What is the sum of the Ten Commandments?
  - Section: Answer
    Content: |-
      The sum of the Ten Commandments is, to love the Lord our God, with all our heart, with all our soul, with all our strength, and with all our mind; and our neighbour as ourselves.
  - Section: Proofs
    References:
    - Matthew 22:37–40
- Number: 48
  Sections:
  - Section: Question
    Content: What is the preface to the Ten Commandments?
  - Section: Answer
    Content: |-
      The preface to the Ten Commandments is in these words: "I am the Lord thy God which have brought thee out of the land of Egypt, out of the house of bondage."
  - Section: Proofs
    References:
    - Exodus 20:2
- Number: 49
  Sections:
  - Section: Question
    Content: What doth the preface to the Ten Commandments teach us?
  - Section: Answer
    Content: |-
      The preface to the Ten Commandments teacheth us that because God is the Lord, and our God and redeemer, therefore we are bound to keep all His commandments.
  - Section: Proofs
    References:
    - Luke 1:74–75
    - 1 Peter 1:15–19
- Number: 50
  Sections:
  - Section: Question
    Content: Which is the first commandment?
  - Section: Answer
    Content: The first commandment is, "Thou shalt have no other gods before me."
  - Section: Proofs
    References:
    - Exodus 20:3
- Number: 51
  Sections:
  - Section: Question
    Content: What is required in the first commandment?
  - Section: Answer
    Content: |-
      The first commandment requireth us to know and acknowledge God to be the only true God and our God, and to worship and glorify Him accordingly.
  - Section: Proofs
    References:
    - 1 Chronicles 28:9
    - Deuteronomy 26:17
    - Matthew 4:10
    - Psalms 29:2
- Number: 52
  Sections:
  - Section: Question
    Content: What is forbidden in the first commandment?
  - Section: Answer
    Content: |-
      The first commandment forbiddeth the denying, or not worshipping and glorifying the true God, as God and our God, and the giving of that worship and glory to any other, which is due unto Him alone.
  - Section: Proofs
    References:
    - Psalms 14:1
    - Romans 1:21
    - Psalms 81:10–11
    - Romans 1:25–26
- Number: 53
  Sections:
  - Section: Question
    Content: |-
      What are we especially taught by these words before me, in the first commandment?
  - Section: Answer
    Content: |-
      These words before me, in the first commandment teach us, that God, who seeth all things, taketh notice of and is much displeased with the sin of having any other God.
  - Section: Proofs
    References:
    - Exodus 8:5
- Number: 54
  Sections:
  - Section: Question
    Content: Which is the second commandment?
  - Section: Answer
    Content: |-
      The second commandment is, "Thou shalt not make unto thee any graven image, or any likeness of anything that is in heaven above, or that is in the earth beneath, or that is in the water under the earth; thou shalt not bow down thyself to them, nor serve them; for I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me; and shewing mercy unto thousands of them that love me, and keep my commandments."
  - Section: Proofs
    References:
    - Exodus 20:4–6
- Number: 55
  Sections:
  - Section: Question
    Content: What is required in the second commandment?
  - Section: Answer
    Content: |-
      The second commandment requireth the receiving, observing, and keeping pure and entire all such religious worship and ordinances, as God hath appointed in His word.
  - Section: Proofs
    References:
    - Deuteronomy 32:46
    - Matthew 23:20
    - Acts 2:42
- Number: 56
  Sections:
  - Section: Question
    Content: What is forbidden in the second commandment?
  - Section: Answer
    Content: |-
      The second commandment forbiddeth the worshipping of God by images or any other way not appointed in His word.
  - Section: Proofs
    References:
    - Deuteronomy 4:15–19
    - Exodus 32:5, 8
    - Deuteronomy 12:31–32
- Number: 57
  Sections:
  - Section: Question
    Content: What are the reasons annexed to the second commandment?
  - Section: Answer
    Content: |-
      The reasons annexed to the second commandment are, God's sovereignty over us, His propriety in us, and the zeal He hath to His own worship.
  - Section: Proofs
    References:
    - Psalms 45:2–3, 6
    - Psalms 45:11
    - Exodus 34:13–14
- Number: 58
  Sections:
  - Section: Question
    Content: Which is the third commandment?
  - Section: Answer
    Content: |-
      The third commandment is, "Thou shalt not take the name of the Lord thy God in vain; for the Lord will not hold him guiltless that taketh His name in vain."
  - Section: Proofs
    References:
    - Exodus 20:7
- Number: 59
  Sections:
  - Section: Question
    Content: What is required in the third commandment?
  - Section: Answer
    Content: |-
      The third commandment requireth the holy and reverent use of God's names, titles, attributes, ordinances, word, and works.
  - Section: Proofs
    References:
    - Matthew 6:9
    - Deuteronomy 28:58
    - Psalms 68:4
    - Revelation 15:3–4
    - Malachi 1:11, 14
    - Psalms 136:1–2
    - Job 36:24
- Number: 60
  Sections:
  - Section: Question
    Content: What is forbidden in the third commandment?
  - Section: Answer
    Content: |-
      The third commandment forbiddeth all profaning and abusing of any thing whereby God makes Himself known.
  - Section: Proofs
    References:
    - Malachi 1:6–7, 12
    - Malachi 2:2
    - Malachi 3:14
- Number: 61
  Sections:
  - Section: Question
