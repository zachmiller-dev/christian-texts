- Number: 13
  Question: How did God create man?
  Answer: |-
    God created man, male and female, after His own image, in knowledge, righteousness, and holiness, with dominion over the creature.
  AnswerWithProofs: |-
    God created man, male and female, after His own image, in knowledge, righteousness, and holiness, with dominion over the creature.
