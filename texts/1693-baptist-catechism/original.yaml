- Number: 6
  Question: What things are chiefly contained in the holy Scriptures?
  Answer: |-
    The holy Scriptures chiefly contain what man ought to believe concerning God, and what duty God requireth of man.
  AnswerWithProofs: |-
    The holy Scriptures chiefly contain what man ought to believe concerning God, and what duty God requireth of man.
