    Content: |-
      How art thou in the Lords Supper admonished and warranted that thou art Partaker of that only Sacrifice of Christ offered on the Cross, and of all his Benefits?
  - Section: Answer
    Content: |-
      Because Christ hath commanded me and all the Faithful to eat of this Bread broken, and to drink of this Cup, distributed in Remembrance of him, with this Promise adjoyned, first, that his Body was as certainly broken and offered for me upon the Cross, and his Blood shed for me, as I behold with my Eyes the Bread of the Lord broken unto me, and the Cup communicated unto me: and further, that my Soul is no less assuredly fed to everlasting life with his Body, which was crucified for me, and his Blood which was shed for me, than I receive and taste by the Mouth of my Body, the Bread and Wine, the Signs of the Body and Blood of our Lord, received at the Hand of the Minister.
