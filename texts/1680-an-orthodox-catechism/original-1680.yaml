- Number: 14
  Sections:
  - Section: Question
    Content: |-
      Is there any creature in Heaven or in Earth, which is only a creature, able to satisfy for us?
  - Section: Answer
    Content: |-
      None. For first God will not punish that Sin in any other creature which man hath committed: and further, neither can that which is nothing but a creature sustain the wrath of God against sin, and deliver others from it.
