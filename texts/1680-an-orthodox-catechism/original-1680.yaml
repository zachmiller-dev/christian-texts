  - Section: AnswerWithProofs
    Content: |-
      That the thing is sure, and out of doubt: for my Prayer is much more certainly heard of God, than I feel in my Heart that I unfeignedly¹ desire the same.
  - Section: Proofs
    References:
    - 2 Corinthians 1:20
    - 2 Timothy 2:13
    - Because he speaketh to the whole Church, and as a publick Duty, not appropriated to any Office, but as a Command universally on all.
    - 'The Apostle distinguisheth this Ordinance from that of preaching, or teaching doctrinally, which belongeth to the Officers, or occasionally, to a gifted Brother: For he doth not say, as in other places, *Teach and admonish*'
    - but gives us the modification of this Admonition, in Psalms, and Hymns, and spiritual Songs.
    - Christ and his Apostles sung an Hymn together, *Mat.* 26. 30.
    - Godly Princes have honoured God this way, as *Hezekiah,* 2 Chron. 29. 30. So *Jehoshaphat,* 2 *Chron.* 20. 21, 22.
    - Worthy Governors, as *Nehemiah,* took care to bless God this way, *Neh.* 7. 1
    - So *Moses*, *Exo.* 1 5.
    - The holy Apostles and Churches in the New Testament have honoured God thus, 1 *Cor.* 14. 1 5. *Eph.* 5. 19. *Col.* 3. 16.
    - Godly Prophets were much in this Practice. 2 *Sam.* 22. is a Song of holy *David,* a little before his death, to bless God for many Mercies
    - so *Moses*, *Deut.* 32. closeth up his Life with a Song.
    - As Singing hath not been too low for Kings and Princes, so not too choice for Subjects. The Body of the People sang, *Numb.* 21. 17. *Then* Israel *sang this Song, Spring up, O Well, sing ye unto it,* Psal. 149. 1, 2.
    - All Sexes have practised this Work, Women as well as Men. *Miriam,* the Sister of *Moses* and *Aaron,* sings a Song to God, *Exod.* 15. 21. So *Deborah,* as well as *Barak*, *Judge.* 5. 1.
    - 'Primitive Christians were much in this Work. *Tertullian* saith, *When we come to a Feast, we sit not down before there is Prayer: and after Meal is past, one cometh forth with a Psalm, either from the holy Scriptures, or else some spiritual Song of his own composure.*'
    - Eminent Fathers practised it. *Basil* calleth Singing, sweet Incense. *Augustin* was highly in commendation of this, and assures us, that *Ambrose* and *Athanasius* were coincident with him in this thing.
    - This Duty is further confirmed by Scripture-Prophecy. Divines observe the 100 Psalm is prophetical of Christ’s Kingdom
    - wherein there will be great cause of rejoycing. So *Isa.* 52. 7, 8. *Musculus* saith, Those Watchmen shall jubilee, when they consider the great Joy approaching by Christ’s Redemption.
    - That Singing is the Musick of Nature, and shall not the Saints sing? The Vallies sing, *Psal.* 65. 13. The Mountains and Trees are said to sing, 1 *Chron.* 16. 32, 33.
    - Singing is the Musick of Ordinances. *Augustin* reports of himself, that when he came to *Millain,* and heard the People sing, he wept for Joy. *Beza* confesses, that when he entred into the Congregation, and heard the People sing the 19th Psalm, he was greatly comforted. The *Rabbins* tell us, that the *Jews,* after the Feast of the Passeover was celebrated, they sung the 111th Psalm, and the five following. And Christ and his Apostles sung an Hymn after Supper.
    - 'This is the Musick of Angels, *Job* 38. 7. The heavenly Host, when they proclaimed the Birth of Christ, declared it in this raised way of Singing: *Luke* 2. 13. Rev. 5. 11.'
    - This is the Musick of Saints, in there triumphant State, in the Bride-Chamber, where will, be eternal *Hallelujahs,* Rev. 15. 3. & 19. 7, 8, 9, & 5. 9, 10, 11, 12, &c. *Psal.* 30. 5. Shall we not begin that Work on Earth, which will be continued in Glory?
    - That this Duty hath been performed in the greatest Numbers. *Numb.* 21. 17. *Psal.* 149. 1, 2. *Exod.* 15.
    - In the greatest Straits, *Acts* 16. 25. *Paul* and *Silas* sang in Prison. This may serve to rectify the Judgment of some, which ask the question
    - How they can sing, when in trouble? When some persuaded *Luther* of the Dangers of the Church, and what a black Cloud did hang over the Church’s head, he then called for the 46th Psalm to be sung, as a Charm against slavish Fear, since called *Luther’s* Psalm.
    - In the greatest Deliverances this Duty hath also been performed, *Exod.* 15. when *Israel* was delivered from *Pharaoh’s* Host, *Psal.* 126. So 2 *Sam.* 22. is a Song for Mercies, and great Deliverances. So shall the Gospel-Church sing after a better manner, when it is out of the Wilderness, and led into the Celestial *Canaan*, *Rev.* 5. 9, 10, 11, 12.
    - '*Moses* praises God by singing in the Wilderness, *Exod.* 1 5.'
    - '*David* praises God in the Tabernacle, *Psal.* 27. 4, 6.'
    - '*Solomon* and *Hezekiah* in the Temple, extoll *Jehovah*, 2 *Chron.* 29. 30.'
    - '*Jehoshaphat,* in the Camp, 2 *Chron.* 20. 20, 21.'
    - Christ and his Apostles, in a private Room, *Mat.* 26. 30.
    - '*Paul* and *Silas,* in a Prison, *Acts* 16. 25.'
    - The Primitive Saints, in publick Assemblies, 1 *Cor.* 14. 5. *Eph.* 5. *Col* 3.
    - With his own glorious Appearance, 2 *Chron.* 20. 17, 20, 21.
    - Crowned with eminent Miracles, *Acts* 16. 25, 26. *As they were praising God, there was a great Earthquake, the Foundation of the Prison was shaken, all the Doors opened, and every Mans Bands loosed.*
    - Honoured with eminent Victories, 2 *Chron.* 20. 21, 22.
    - 'This Ordinance is of great Benefit to the Church: It is for Admonition, *Col.* 3. 16. and Teaching.'
    - It can sweeten a Prison
    - so it did to *Paul* and *Silas*, *Acts* 16.
    - It can prepare the Soul for suffering
    - so Christ sings before he dies, *Mat.* 26. 30.
    - It enlivens and exhilarates the Soul in trouble.
    - Because the Word saith, *Eph.* 5. 14. *Col.* 3. 16. They should be *speaking to one another*, *and admonishing one another in Psalms, Hymns, and spiritual Songs:* But we cannot admonish one another by silent speakings, and inward rejoicings.
    - As the Apostle saith, there must be Melody in the Heart
    - 'so he saith as well, we must sing: one contains the inward Frame, the other, the outward Act. Sing with the Voice, as well as with the Heart.'
    - Singing in Scripture is ever put in distinction from reading, praying, & speaking, and commonly signifies a modulation of the Tongue, or expressing any thing musically
    - and so ’tis a musical speaking. None will say, when they hear a Man speak or pray, that that Man is singing. This would make the greatest confusion in Ordinances imaginable. Hence ’tis said, Christ and his Disciples sung an Hymn, or praised God by singing. And that *Paul* and *Silas* sung vocally and audibly, is plain
    - for ’tis said, the Prisoners heard them, *Acts* 16.
    - The Union of Heart, Tongue, and Voice, make the spiritual way of Worship under the Gospel compleat. We have not any thing as typical now to look at, as the Lute and Harp were in the Law, as also those Ceremonies which typed out Christ’s Sacrifice
    - but when the Substance came, the Shadow ceased. So the Spirit being more abundantly poured out, we have no need of those Instruments
    - but there needs Soul and Body always to sing forth the high Praises of God.
    - Moreover, to speak of an extraordinary Gift to sing in the Church, is the ready way to weaken the Authority of the Scripture
    - for how came so many so much to slight the Scriptures, but by pretending to extraordinary Gifts, and new Revelations?
    - 'It is the ready way to make Hypocrites, and impose a Deceit upon the whole Church: For how easy is it for a Man to compose by strength of parts an excellent Hymn, and deliver it by strength of memory, and pretend he is immediatly inspired? How many such Cheats have been in our days?'
    - 'God never made any such Promise of giving an extraordinary Gift of Singing: of Prayer, Supplication, Preaching, he hath: If there had been such a Gift promised, it would have been made by Christ, as the Gift of Tongues and Miracles was'
    - and then no doubt but the Saints would have been instructed to seek for it, and such as had it, would have been commanded to wait on it, as God doth exhort his to wait on Teaching & Ruling, *Rom.* 12.
    - To be sure, Christ would not ordain an Ordinance of that consequence as Singing is of, which most of the Churches in the World must want the use of, for the want of a pretended Gift. That Christ hath appointed this Ordinance in his Church, we have shewed
    - 'that he never promised any extraordinary Gift of Singing, is clear: therefore we may conclude, as God ordinarily giveth every Christian a Spirit of Prayer, so he also hath ordinarily given them a Gift to sing Praises to God: And as many might pray better, if they used it more'
    - so many may want a Gift of Singing for want of use.
    - As for that in 1 *Cor.* 14. 26. *One hath a Psalm*, *and another a Doctrine,* &c. It doth not concern us to expect that Gift as they had, because they had a Doctrine, a Tongue, a Revelation, an Interpretation, a Psalm after an extraordinary manner. Yet we say, tho we have not the Spirit of Prayer, as the Church had, *Act.* 4. to make the place shake, as the effect of it
    - nor cannot preach extraordinarily, as *Peter* did to the 3000, & to the House of *Cornelius*
    - yet we say not, Preaching and Prayer is ceased. So tho none should have an extraordinary Gift to sing now, as they might have in the Church of *Corinth*, yet the Duty remains still in the Church, as a standing Ordinance, as well as Prayer and Preaching.
    - With Understanding, 1 *Cor.* 14. 15. As we must pray, so we must sing. We must not only be guided by the Tune, but Words of the Psalm, the matter more than the manner
    - else this would be more the work of a Chorister than a Christian. Upon this *Davenant* cries out, Adieu to the bellowing of the Papists, who sing in an unknown Tongue. God will not understand us in this Service, which we understand not our selves.
    - We must sing with zeal and affection. Love is the fulfilling of the Law. ’Tis a notable saying of *Augustin,* ’Tis not Crying, but Loving sounds in the Ears of God, that makes the Musick. *Isa.* 5. 1.
    - We must sing with Grace, *Col.* 3. 16. ’Tis Grace, not Nature, sweetens the Musick. One well notes, that Grace is the root of true Devotion. God will not hear Sinners when they pray, no, nor when they sing, they make a noise like a crack’d String of a Lute or Viol. The Raven only crokes, ’tis the Nightingale sings. The singing of wicked Men is but disturbance, not obedience. The Saints above sing their *Hallelujahs* in Glory, the Saints below must sing their Psalms with Grace.
    - We must sing with spiritual Joy. Singing is the only triumphant Gladness of a gracious Heart. We must sing, as *David* danced before the Ark, with Shouting and Rejoycing, 2 *Sam.* 6. 13.
    - We must sing with Faith. This Grace only puts a pleasantness upon every Duty, *Heb.* 4. 2. We must bring Faith always to Christ’s Table, or else, as *Augustin* saith, if Faith be asleep, Christ is asleep. Faith carrieth on this Ordinance of Singing, so as it may be accepted of God.
    - We must sing with excited Grace, not only with Grace habitual, but excited and actual
    - we must stir up the Grace in us, 1 *Tim.* 4. 14. And cry out as *David*, *Psalm* 57. 8. Awake Love, awake Delight. The Clock must be pull’d up before it can guide our time. God loveth active Grace in Duty, that the Soul should be ready trimm’d when it presents it self to Christ in any Worship.
    - We must sing in the Spirit, as well as pray in the Spirit, 1 *Cor.* 14. 15, 16. *Jude ver.* 20. The Spirit must breath as well as Grace acts. *Davenant* saith, they are called spiritual Songs, in point of their Original. The Spirit excits and compleats the Soul to this holy Service. Thus *Eph.* 5. 18. He exhorts to be filled with the Spirit, and so calls us to sing spiritual Songs as the effect of this Fulness. This Wind must fill our Organs before we can make any musick
    - ’tis so called, *John* 3. 8.
    - We must take great care to keep our Hearts while about this Work. One observes, Without this we may please Men with the artificial suavity of the Voice, and displease God with the odious impurity of the Heart.
    - Neglect not preparatory Prayer for Singing, as well as other Duties. ’Tis *Jehovah* is the great Harmonist, who must put every Heart in Tune, scrue up every Peg of Affection, and strain every String of Meditation. *Prov.* 16. 1.
    - 'Labour to see thy Interest in Christ clear, when thou goest about this Work. If we are not in Christ, we are certainly out of tune. It is Christ must put acceptation upon this Service as well as all others. Here the Altar must sanctifie the Gift. Christ perfumes the Prayers of Saints, *Rev.* 5. 8. And he must articulate their Singing. Though we have *Esau’s* Garments, he can give us *Jacob’s* Voice: if we are in him, he can raise our Hearts to a pleasing Elevation.'
    - Let us sometimes raise our Hearts into holy Contemplations, let us think of the musick of the Bride-Chamber, there shall be no crackt Strings, displeasing Sounds, harsh Voices, nothing to abate our Melody
    - 'there shall be no Willows to hang our Harps upon, *Psalm* 137. 2. In the Bride-Chamber, there shall be no sorrow to interfere. When we sing the Song of the Lamb, there shall be no Grief to jar our Harmony: for which Day let us all pray.'
