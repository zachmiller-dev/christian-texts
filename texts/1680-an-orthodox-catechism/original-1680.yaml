  Sections:
  - Section: Question
    Content: |-
      Where hath Christ promised that he will as certainly give his Body and Blood so to be eaten and drunken, as they eat this Bread broken, and drink this Cup?
  - Section: Answer
    Content: |-
      In the Institution of the Supper, the Words whereof are these. Our Lord Jesus Christ in the Night that he was betrayed, took Bread, and when he had given thanks, he brake it, and said, Take, eat, this is my Body which is broken for you: this do in Remembrance of me. Likewise also he took the Cup, when he had supped, and said, This Cup, is the new Testament in my Blood; this do as often as ye shall drink it in Remembrance of me: for as often as ye shall eat this Bread, and drink this Cup, ye shew the Lords Death till he come. This Promise, is repeated by St. Paul where he saith, The Cup of blessing which we bless, is it not the Communion of the Blood of Christ? the Bread which we break, is it not the Communion of the Body of Christ? for we that are many, are one Bread, and one Body, because we are all Partakers of one Bread.
