  Sections:
  - Section: Question
    Content: |-
      Why then doth Christ call Bread his Body, and the Cup his Blood, or the new Testament in his Blood; and St. Paul calleth Bread and Wine the Communion of the Body and Blood of Christ?
  - Section: Answer
    Content: |-
      Christ not without great Consideration speaketh so, to wit, not only for to teach us that as the Bread and Wine sustain the Life of the Body, so also his crucified Body, and Blood shed, are indeed the Meat and Drink of our Souls, whereby they are nourished to eternal Life; but much more that by this visible Signe and Pledg, he may assure us that we are as verily Partakers of his Body and Blood, through the working of the Holy Ghost, as we do perceive by the Mouth of our Body, these holy Signes in Remembrance of him; and further also, that his Sufferings and Obedience is so certainly ours, as though we our selves had suffered Punishments for our Sins, and had satisfied God.
