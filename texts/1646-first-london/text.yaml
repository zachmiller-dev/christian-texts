Metadata:
  Title: First London Baptist Confession
  AlternativeTitles: []
  Year: '1646'
  Authors:
  - seven Particular Baptist congregations in London
  Location:
  OriginalLanguage: English
  OriginStory: ''
  SourceUrl: https://www.reformedreader.org/ccc/h.htm
  SourceAttribution: Public Domain
  CreedFormat: Confession
Data:
- Chapter: '1'
  Title: Article I
  Sections:
  - Section: '1'
    Content: |-
      That God as He is in Himself, cannot be comprehended of any but himself, dwelling in that inaccessible light, that no eye can attain unto, whom never man saw, nor can see; that there is but one God, one Christ, one Spirit, one Faith, one Baptism; one rule of holiness and obedience for all Saints, at all times, in all places to be observed.

      *Proofs:*
      - 1 Timothy 6:16
      - 1 Timothy 2:5
      - Ephesians 4:4-6
      - 1 Corinthians 12:4-6, 13
      - John 14
      - 1 Timothy 6:3, 13, 14
      - Galatians 1:8-9
      - 2 Timothy 3:15
- Chapter: '2'
  Title: Article II
  Sections:
  - Section: '1'
    Content: |-
      That God is of Himself, that is, neither from another, nor of another, nor by another, nor for another: But is a Spirit, who as his being is of Himself, so He gives being, moving, and preservation to all other things, being in Himself eternal, most holy, every way infinite in greatness, wisdom, power, justice, goodness, truth, etc. In this Godhead, there is the Father, the Son, and the Spirit; being every on of them one and the same God; and therefore not divided, but distinguished one from another by their several properties; the Father being from Himself, the Son of the Father from everlasting, the Holy Spirit proceeding from the Father and the Son.

      *Proofs:*
      - Isaiah 43:11
      - Isaiah 46:9
      - John 4:24
      - Exodus 3:14
      - Romans 11:36
      - Acts 17:28
      - 1 Corinthians 8:6
      - Proverbs 8:22-23
      - John 15:16
      - Galatians 4:6
- Chapter: '3'
  Title: Article III
  Sections:
  - Section: '1'
    Content: |-
      That God has decreed in Himself from everlasting touching all things, effectually to work and dispose them according to the counsel of His own will, to the glory of His name; in which decree appears His wisdom, constancy, truth, and faithfulness; Wisdom is that whereby He contrives all things; Constancy is that whereby the decree of God remains always immutable; Truth is that whereby He declares that alone which He has decreed, and though His sayings may seem to sound sometimes another thing, yet the sense of them does always agree with the decree; Faithfulness is that whereby He effects that He has decreed, as He has decreed. And touching His creature man, God had in Christ before the foundation of the world, according to the good pleasure of His will, foreordained some men to eternal life through Jesus Christ, to the praise and glory of His grace, leaving the rest in their sin to their just condemnation, to the praise of His justice.

      *Proofs:*
      - Isaiah 46:10
      - Ephesians 1:11
      - Colossians 2:3
      - Numbers 23:19-20
      - Jeremiah 10:10
      - Romans 3:4
      - Isaiah 44:10
      - Ephesians 1:3-7
      - 2 Timothy 1:9
      - Acts 13:48
      - Romans 8:29-30
      - Jude 1:4, 6
      - Romans 9:11-13
      - Proverbs 16:4
- Chapter: '4'
  Title: Article IV
  Sections:
  - Section: '1'
    Content: |-
      In the beginning God made all things very good, created man after His own image and likeness, filling him with all perfection of all natural excellency and uprightness, free from all sin. But long he abode not in this honor, but by the subtlety of the Serpent, which Satan used as his instrument, himself with his angels having sinned before and not kept their first estate, but left their own habitation; first Eve, then Adam being seduced did wittingly and willingly fall into disobedience and transgression of the Commandment of their great Creator, for the which death came upon all, and reigned over all, so that all since the Fall are conceived in sin, and brought forth in iniquity, and so by nature children of wrath, and servants of sin, subjects of death, and all other calamities due to sin in this world and for ever, being considered in the state of nature, without relation to Christ.

      *Proofs:*
      - Genesis 1
      - Colossians 1:16
      - Hebrews 11:3
      - Isaiah 45:12
      - Genesis 1:26
      - 1 Corinthians 15:45-46
      - Ecclesiastes 7:31
      - Psalms 49:20
      - Genesis 3:1, 4, 5
      - 2 Corinthians 11:3
      - 2 Peter 2:4
      - Jude 1:6
      - John 8:44
      - Genesis 3:1, 2, 6
      - 1 Timothy 2:14
      - Ecclesiastes 7:31
      - Galatians 3:32
      - Romans 5:12, 18, 19
      - Romans 6:23
      - Ephesians 2:3
- Chapter: '5'
  Title: Article V
  Sections:
  - Section: '1'
    Content: |-
      All mankind being thus fallen, and become altogether dead in sins and trespasses, and subject to the eternal wrath of the great God by transgression; yet the elect, which God has loved with an everlasting love, are redeemed, quickened, and saved, not by themselves, neither by their own works, lest any man should boast himself, but wholly and only by God of His free grace and mercy through Jesus Christ, who of God is made unto us wisdom, righteousness, sanctification and redemption, that as it is written he that rejoices, let him rejoice in the Lord.

      *Proofs:*
      - Jeremiah 31:2
      - Genesis 3:15
      - Ephesians 1:3, 7
      - Ephesians 2:4, 9
      - 1 Thessalonians 5:9
      - Acts 13:38
      - 1 Corinthians 5:21
      - Jeremiah 9:23, 24
- Chapter: '6'
  Title: Article VI
  Sections:
  - Section: '1'
    Content: |-
      This therefore is life eternal, to know the only true God, and whom He has sent Jesus Christ. And on the contrary, the Lord will render vengeance in flaming fire to them that know not God, and obey not the Gospel of our Lord Jesus Christ.

      *Proofs:*
      - John 17:3
      - Hebrews 5:9
      - Jeremiah 23:5, 6
      - 2 Thessalonians 1:8
      - John 3:36
- Chapter: '7'
  Title: Article VII
  Sections:
  - Section: '1'
    Content: |-
      The rule of this knowledge, faith, and obedience, concerning the worship and service of God, and all other Christian duties, is not mans inventions, opinions, devices, laws, constitutions, or traditions unwritten whatsoever, but only the word of God contained in the Canonical Scriptures.

      *Proofs:*
      - John 5:39
      - 2 Timothy 3:15-17
      - Colossians 21:18, 23
      - Matthew 15:9
- Chapter: '8'
  Title: Article VIII
  Sections:
  - Section: '1'
    Content: |-
      In this written Word God has plainly revealed whatsoever He has thought needful for us to know, believe, and acknowledge, touching the nature and office of Christ, in whom all the promises are Yea and Amen to the praise of God.

      *Proofs:*
      - Acts 3:22, 23
      - Hebrews 1:1, 2
      - 2 Timothy 3:15-17
      - 2 Corinthians 1:20
- Chapter: '9'
  Title: Article IX
  Sections:
  - Section: '1'
    Content: |-
      Touching the Lord Jesus, of whom Moses and the Prophets wrote, and whom the Apostles preached, is the Son of God the Father, the brightness of His glory, the ingrave form of His being, God with Him and with His Holy Spirit, by whom He made the world, by whom He upholds and governs all the works He has made, who also when the fullness of time was come was, was made man of a woman, of the Tribe of Judah, of the seed of Abraham and David, to wit, of Mary that blessed Virgin, by the Holy Spirit coming upon her, and the power of the most High overshadowing her, and was also in all things like unto us, sin only excepted.

      *Proofs:*
      - Genesis 3:15
      - Genesis 22:18
      - Genesis 49:10
      - Daniel 7:13
      - Daniel 9:24-26
      - Proverbs 8:23
      - John 1:1-3
      - Colossians 1:1, 15-17
      - Galatians 4:4
      - Hebrews 7:14
      - Revelation 5:5 with
      - Genesis 49:9-10
      - Romans 1:3
      - Romans 9:5
      - Matthew 1:16
      - Luke 3:23, 26
      - Hebrews 2:16
      - Isaiah 53:3-5
      - Philippians 2:8
- Chapter: '10'
  Title: Article X
  Sections:
  - Section: '1'
    Content: |-
      Touching His office, Jesus Christ only is made the Mediator of the New Covenant, even the everlasting covenant of grace between God and man, to be perfectly and fully the Prophet, Priest and King of the Church of God for evermore.

      *Proofs:*
      - 2 Timothy 2:15
      - Hebrews 9:15
      - John 14:6
      - Hebrews 1:2
      - Hebrews 3:1, 2
      - Hebrews 7:24
      - Acts 5:31
- Chapter: '11'
  Title: Article XI
  Sections:
  - Section: '1'
    Content: |-
      Unto this office He was fore-ordained from everlasting, by the authority of the Father, and in respect of His manhood, from the womb called and separated, and anointed also most fully and abundantly with all gifts necessary, God having without measure poured the Spirit upon Him.

      *Proofs:*
      - Proverbs 8:23
      - Isaiah 42:6
      - Isaiah 49:1, 5
      - Isaiah 11:2-5
      - Isaiah 61:1-3 with
      - Luke 4:17, 22; John1:14
      - Luke 16
      - Luke 3:34
- Chapter: '12'
  Title: Article XII
  Sections:
  - Section: '1'
    Content: |-
      In this call the Scripture hold forth two special things considerable; first, the call to the office; secondly the office its self. First, that none takes this honor but he that is called of God, as was Aaron, so also Christ, it being an action especially of God the Father, whereby a special covenant being made, He ordains His Son to this office: which Covenant is, that Christ should be made a sacrifice for sin, that He shall see His seed, and prolong His days, and the pleasure of the Lord shall prosper in His hand; which calling therefore contains in it selfchoosing, for-ordaining, sending. choosing respects the end, foreordaining the means, sending the execution it self, all of mere grace, without any condition fore-seen wither in men, on in Christ Himself.

      *Proofs:*
      - Hebrews 5:4-6
      - Isaiah 53:10
      - Isaiah 42:13
      - 1 Peter 1:20
      - John 3:17
      - John 9:27
      - John 10:36
      - John 8:32
- Chapter: '13'
  Title: Article XIII
  Sections:
  - Section: '1'
    Content: |-
      So that this office to be Mediator, that is, to be Prophet, Priest, and King of the Church of God, is so proper to Christ, as neither in the whole, not in any part thereof, it can be transferred from Him to any other.

      *Proofs:*
      - 1 Timothy 2:15
      - Hebrews 7:24
      - Daniel 5:14
      - Acts 4:12
      - Luke 1:23
      - John 14:6
- Chapter: '14'
  Title: Article XIV
  Sections:
  - Section: '1'
    Content: |-
      This office it self to which Christ was called, is three fold, of a Prophet, of Priest, and of King: this number and order of offices is showed; first by mens necessities grievously laboring under ignorance, by reason whereof they stand in infinite necessity of the Prophetical office of Christ to relieve them. Secondly, alienation from God, wherein they stand in need of the Priestly office to reconcile them. Thirdly, our utter disability to return to Him, by which they stand in need of the power of Christ in His Kingly office to assist and govern them.

      *Proofs:*
      - Deuteronomy 18:15 with
      - Acts 3:22-23
      - Psalms 110:3
      - Hebrews 3:1
      - Hebrews 4:14-15
      - Hebrews 5:6
      - Psalms 2:6
      - Acts 26:18
      - Colossians 1:3
      - Colossians 1:21
      - Ephesians 2:12
      - Song of Solomon 1:3
      - John 6:44
- Chapter: '15'
  Title: Article XV
  Sections:
  - Section: '1'
    Content: |-
      Touching the Prophesy of Christ, it is that whereby He has perfectly revealed the whole will of God out of the bosom of the Father, that is needful for His servants to know, believe, and obey; and therefore is called not only a Prophet and a Doctor, and the Apostle of our profession, and the Angel of the Covenant; but also the very wisdom of God, and the treasures of wisdom and understanding.

      *Proofs:*
      - John 1:18
      - John 12:49-50
      - John 15
      - John 17:8
      - Deuteronomy 18:15
      - Matthew 23:10
      - Hebrews 3:1
      - Malachi 3:1
      - 1 Corinthians 1:24
      - Colossians 2:3
- Chapter: '16'
  Title: Article XVI
  Sections:
  - Section: '1'
    Content: |-
      That He might be such a Prophet as thereby to every way complete, it was necessary that He should be God, and withall also that He should be man; for unless He had been God, He could have never perfectly understood the will of God, neither had He have been able to reveal it throughout all ages; and unless He had been man, He could not fitly have unfolded it in His own person to man.

      *Proofs:*
      - John 1:18
      - John 3:13
      - 1 Corinthians 2:11, 16
      - Acts 3:22 with
      - Deuteronomy 18:15
      - Hebrews 1:1
- Chapter: '17'
  Title: Article XVII
  Sections:
  - Section: '1'
    Content: |-
      Touching His Priesthood, Christ being consecrated, has appeared once to put away sin by the offering and sacrifice of Himself, and to this end has fully performed and suffered all those things by which God, through the blood of that His Cross in an acceptable sacrifice, might reconcile His elect only; and having broken down the partition wall, and therewith finished and removed all the rites, shadows, and ceremonies, is now entered within the vail, into the Holy of Holiest, that is, to the very Heavens, and presence of God, where He for ever lives and sits at the right hand of Majesty, appearing before the face of His Father to make intercession for such as come to the Throne of Grace by that new and living way; and not that only, but makes His people a spiritual House, an holy Priesthood, to offer up spiritual sacrifice acceptable to God through Him; neither does the Father accept, or Christ offer to the Father any other worship or worshipers.

      *Proofs:*
      - John 17:19
      - Hebrews 5:7-9
      - Hebrews 9:26
      - Romans 5:19
      - Ephesians 5:12
      - Colossians 1:20
      - Ephesians 2:14-16
      - Romans 8:34
      - 1 Peter 2:5
      - John 4:23, 24
- Chapter: '18'
  Title: Article XVIII
  Sections:
  - Section: '1'
    Content: |-
      This Priesthood was not legal, or temporary, but according to the order of Melchisecdec not by a carnal commandment, but by the power of endless life; not by an order that is weak and lame, but stable and perfect, not for a time, but for ever, admitting no successor, but perpetual and proper to Christ, and of Him that ever lives. Christ Himself was the Priest, Sacrifice and Alter: He was Priest, according to both natures, He was a sacrifice most properly according to His human nature: where in Scripture it is wont to be attributed to His body, to His blood; yet the chief force whereby this sacrifice was made effectual, did depend upon Hisdivine nature, namely, that the Son of God did offer Himself for us: He was the alter properly according to His divine nature, it belonging to the Alter to sacrifice that which is offered upon it, and so it ought to be of greater dignity then the Sacrifice itself.

      *Proofs:*
      - Hebrews 7:17
      - Hebrews 7:16
      - Hebrews 7:18-21
      - Hebrews 7:24-25
      - Hebrews 5:6
      - Hebrews 10:10
      - 1 Peter 1:18-19
      - Colossians 1:20-21
      - Isaiah 53:10
      - Matthew 20:28
      - Acts 20:28
      - Romans 8:3
      - Hebrews 9:14
      - Hebrews 13:10, 12, 15
      - Matthew 23:17
      - John 17:19
- Chapter: '19'
  Title: Article XIX
  Sections:
  - Section: '1'
    Content: |-
      Touching His Kingdom, Christ being risen from the dead, ascended into Heaven, sat on the right hand of God the Father, having all power in Heaven and earth, given unto Him, He does spiritually govern His Church, exercising His power over all angels and men, good and bad, to the preservation and salvation of the elect, to the over-ruling and destruction of His enemies, which are reprobates, communicating and applying the benefits, virtue, and fruit of His Prophecy and Priesthood to His elect, namely, to the subduing and taking away of their sins, to their justification and adoption of Sons, regeneration, sanctification, preservation and strengthening in all their conflicts against Satan, the World, the Flesh, and the temptations of them, continually dwelling in, governing and keeping their hearts in faith and filial fear by His Spirit, which having given it, He never takes it away from them, but by it still begets and nourishes in them faith, repentance, love, joy, hope, and all heavenly light in the soul unto immortality, notwithstanding through our own unbelief, and the temptations of Satan, the sensible sight of this light and love be clouded and overwhelmed for the time. And on the contrary, ruling in the world over His enemies, Satan, and all the vessels of wrath, limiting, using, restraining them by His mighty power, as seems good in His divine wisdom and justice to the execution of His determinate counsel, delivering them up to a reprobate mind, to be kept through their own deserts, in darkness and sensuality unto judgment.

      *Proofs:*
      - 1 Corinthians 15:4
      - 1 Peter 3:21-22
      - Matthew 28:18-20
      - Luke 24:51
      - Acts 1:11
      - Acts 5:30-31
      - John 19:36
      - Romans 14:17
      - Mark 1:27
      - Hebrews 1:14
      - John 16:7, 15
      - John 5:26-27
      - Romans 5:5-7
      - Romans 14:17
      - Galatians 5:22, 23
      - John 1:4, 13
      - John 13:1
      - John 10:28-29
      - John 14:16-17
      - Romans 11:29
      - Psalms 51:10-11
      - Job 33:29-30
      - 2 Corinthians 12:7, 9
      - Job 1
      - Job 2
      - Romans 1:21
      - Romans 2:4-6
      - Romans 9:17-18
      - 2 Peter 2
- Chapter: '20'
  Title: Article XX
  Sections:
  - Section: '1'
    Content: |-
      This Kingdom shall be then fully perfected when He shall the second time come in glory to reign among His saints, and to be admired of all them which do believe, when He shall put down all rule and authority under His feet, that the glory of the Father my be full and perfectly manifested in His Son, and the glory of the Father and the Son in all His members.

      *Proofs:*
      - 1 Corinthians 15:24, 28
      - Hebrews 9:28
      - 2 Thessalonians 1:9, 10
      - 1 Thessalonians 4:15-17
      - John 17:21, 26
- Chapter: '21'
  Title: Article XXI
  Sections:
  - Section: '1'
    Content: |-
      That Christ Jesus by His death did bring fourth salvation and reconciliation only for the elect, which were those which God the Father gave Him; and that the Gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever blessed God, filled with the perfection of all heavenly and spiritual excellencies, and that salvation is only and alone to be had through the believing in His name.

      *Proofs:*
      - John 15:13
      - Romans 8:32-34
      - Romans 5:11
      - Romans 3:25
      - Job 17:2 with 6:37
      - Matthew 16:16
      - Luke 2:26
      - John 6:9
      - John 7:3
      - John 20:31
      - 1 John 5:11
- Chapter: '22'
  Title: Article XXII
  Sections:
  - Section: '1'
    Content: |-
      That faith is thegift of God wrought in the hearts of the elect by the Spirit of God, whereby they come to see, know, and believe the truth of the Scriptures, and not only so, but the excellency of them above all other writing and things in the world, as they hold forth the glory of God in His attributes, the excellency of Christ in His nature and offices, and the power of the fullness of the Spirit in His workings and operations; and thereupon are enabled to cast the weight of their souls upon this truth thus believed.

      *Proofs:*
      - Ephesians 2:8
      - John 6:29
      - John 4:10
      - Philippians 1:29
      - Galatians 5:22
      - John 17:17
      - Hebrews 4:11-12
      - John 6:63
- Chapter: '23'
  Title: Article XXIII
  Sections:
  - Section: '1'
    Content: |-
      Those that have this precious faith wrought in them by the Spirit, can never finally nor totally fall away; and though many storms and floods do arise and beat against them, yet they shall never be able to take them off that foundation and rock which by faith they are fastened upon, but shall be kept by the power of God to salvation, where they shall enjoy their purchased possession, they being formerly engraven upon the palms of God's hands.

      *Proofs:*
      - Matthew 7:24, 25
      - John 13:1
      - 1 Peter 1:4-6
      - Isaiah 49:13-16
- Chapter: '24'
  Title: Article XXIV
  Sections:
  - Section: '1'
    Content: |-
      That faith is ordinarily begot by the preaching of the Gospel, or word of Christ, without respect to any power or capacity in the creature, but it is wholly passive, being dead in sins and trespasses, does believe, and is converted by no less power, then that which raised Christ from the dead.

      *Proofs:*
      - Romans 10:17
      - 1 Corinthians 1:21
      - Romans 9:16
      - Romans 2:1, 2
      - Ezekiel 16:6
      - Romans 3:12
      - Romans 1:16
      - Ephesians 1:19
      - Colossians 2:12
- Chapter: '25'
  Title: Article XXV
  Sections:
  - Section: '1'
    Content: |-
      That the tenders of the Gospel to the conversion of sinners, is absolutely free, no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the Law, or preceding ministry of the Law, but only and alone the naked soul, as a sinner and ungodly to receive Christ, as Christ, as crucified, dead, and buried, and risen again, being made a Prince and a Savior for such sinners.

      *Proofs:*
      - John 3:14, 15
      - John 1:12
      - Isaiah 55:1
      - John 7:37
      - 1 Timothy 1:15
      - Romans 4:5
      - Romans 5:8
      - Acts 5:30-31
      - Acts 2:36
      - 1 Corinthians 1:22-24
- Chapter: '26'
  Title: Article XXVI
  Sections:
  - Section: '1'
    Content: |-
      That the same power that converts to faith in Christ, the same power carries on the soul still through all duties, temptations, conflicts, sufferings, and continually what ever a Christian is, he is by grace, and by a constant renewed operation from God, without which he cannot perform any duty to God, or undergo any temptations from Satan, the world, or men.

      *Proofs:*
      - 1 Peter 1:5
      - 2 Corinthians 12:9
      - 1 Corinthians 15:10
      - Philippians 2:12, 13
      - John 15:5
      - Galatians 2:19-20
- Chapter: '27'
  Title: Article XXVII
  Sections:
  - Section: '1'
    Content: |-
      That God the Father, and Son, and Spirit, is one with all believers, in their fullness, inrelations as head and members, as house and inhabitants, as husband and wife, one with Him, as light and love, and one with Him in His inheritance, and in all His glory; and that all believers by virtue of this union and oneness with God, are the adopted sons of God, and heirs of Christ, co-heirs and joint heirs with Him of the inheritance of all the promises of this life, and that which is to come.

      *Proofs:*
      - 1 Thessalonians 1:1
      - John 14:10, 20
      - John 17:21
      - Colossians 2:9, 10
      - Colossians 1:19
      - John 1:17
      - John 20:17
      - Hebrews 2:11
      - Colossians 1:18
      - Ephesians 5:30
      - Ephesians 2:22
      - 1 Corinthians 3:16-17
      - Isaiah 16:5
      - 2 Corinthians 11:3
      - Galatians 3:26
      - John 17:24
- Chapter: '28'
  Title: Article XXVIII
  Sections:
  - Section: '1'
    Content: |-
      That those which have union with Christ, are justified from all their sins, past,present, and to come, by the blood of Christ; which justification we conceive to be a gracious and free acquittance of a guilty, sinful creature, from all sin by God, through the satisfaction that Christ has made by His death; and this applied in the manifestation of it through faith.

      *Proofs:*
      - John 1:7
      - Hebrews 10:14
      - Hebrews 9:26
      - 2 Corinthians 5:19
      - Romans 3:23
      - Acts 13:38, 39
      - Romans 5:1
      - Romans 3:25, 30
- Chapter: '29'
  Title: Article XXIX
  Sections:
  - Section: '1'
    Content: |-
      That all believers are a holy and sanctified people, and that sanctification is a spiritual grace of the New Covenant, and effect of the love of God, manifested to the soul, whereby the believer is in truth and reality separated, both in soul and body, from all sin and dead works, through the blood of the everlasting Covenant, whereby he also presents after a heavenly and evangelical perfection, in obedience to all the commands, which Christ as Head and King in this New Covenant has prescribed to him.

      *Proofs:*
      - 1 Corinthians 1:1
      - 1 Peter 2:9
      - Ephesians 1:4
      - 1 John 4:16
      - Ephesians 4:24
      - Philippians 3:15
      - Matthew 28:20
- Chapter: '30'
  Title: Article XXX
  Sections:
  - Section: '1'
    Content: |-
      All believers through the knowledge of that justification of life given by the Father, and brought forth by the blood of Christ, have this as their great privilege of that New Covenant, peace with God, and reconciliation, whereby they that were afar off, were brought nigh by that blood, and have (as the Scripture speaks) peace passing all understanding, yes, joy in God, through our Lord Jesus Christ, by whom we have received the Atonement.

      *Proofs:*
      - 2 Corinthians 5:19
      - Isaiah 54:10
      - Isaiah 26:12
      - Ephesians 2:13-14
      - Philippians 4:7
      - Romans 5:10-11
- Chapter: '31'
  Title: Article XXXI
  Sections:
  - Section: '1'
    Content: |-
      That all believers in the time of this life, are in a continual warfare, combat, and opposition against sin, self, the world, and the Devil, and liable to all manner of afflictions, tribulations, and persecutions, and so shall continue until Christ comes in His Kingdom, being predestined and appointed there unto; and whatsoever the saints, any of them do possess or enjoy of God in this life, is only by faith.

      *Proofs:*
      - Ephesians 6:10-13
      - 2 Corinthians 10:3
      - Revelation 2:9, 10
- Chapter: '32'
  Title: Article XXXII
  Sections:
  - Section: '1'
    Content: |-
      That the only strength by which the saints are enabled to encounter with all opposition, and to overcome all afflictions, temptations, persecutions, and trials, is only by Jesus Christ, who is the Captain of their salvation, being made perfect through sufferings, who has engaged His strength to assist them in all their afflictions, and to uphold them under all their temptations, and to preserve them by His power to His everlasting Kingdom.

      *Proofs:*
      - John 16:33
      - Hebrews 2:9, 10
      - John 15:5
- Chapter: '33'
  Title: Article XXXIII
  Sections:
  - Section: '1'
    Content: |-
      That Christ has here on earth a spiritual Kingdom, which is the Church, which He has purchased and redeemed to Himself, as a particular inheritance: which Church, as it is visible to us, is a company of visiblesaints, called and separated from the world, by the Word and the Spirit of God, to the visible profession of the faith of the Gospel, being baptized into the faith, and joined to the Lord, and each other, by mutual agreement, in the practical enjoyment of the ordinances, commanded by Christ their head and King.

      *Proofs:*
      - 1 Corinthians 1:1
      - Ephesians 1:1
      - Romans 1:1
      - Acts 26:18
      - 1 Thessalonians 1:9
      - 2 Corinthians 6:17
      - Revelation 18:18
      - Acts 2:37 with
      - Acts 10:37
      - Romans 10:10
      - Acts 2:42
      - Acts 20:21
      - Matthew 18:19, 20
      - 1 Peter 2:5
- Chapter: '34'
  Title: Article XXXIV
  Sections:
  - Section: '1'
    Content: |-
      To this Church He has made His promises, and given the signs of His Covenant, presence, love, blessing, and protection: here are the fountains and springs of His heavenly grace continually flowing forth; thither ought all men to come, of all estates, that acknowledge Him to be their Prophet, Priest, and King, to be enrolled amongst His household servants, to under His heavenly conduct and government, to lead their lives in His walled sheepfold, and watered garden, to have communion here with the saints, that they may be made to be partakers of their inheritance in the Kingdom of God.

      *Proofs:*
      - Matthew 28:18-20
      - 2 Corinthians 6:18
      - Isaiah 8:16
      - 1 Timothy 3:15
      - 1 Timothy 4:16
      - 1 Timothy 6:3, 5
      - Acts 2:41, 47
      - Song of Solomon 4:12
      - Galatians 6:10
      - Ephesians 2:19
- Chapter: '35'
  Title: Article XXXV
  Sections:
  - Section: '1'
    Content: |-
      And all His servants are called thither, to present their bodies and souls, and to bring their gifts God has given them; so being come, they are here by Himself bestowed in their several order, peculiar place, due use, being fitly compact and knit together, according to the effectual working of every part, to the edification of itself in love.

      *Proofs:*
      - 1 Corinthians 12:6, 7, 12, 18
      - Romans 12:4-6
      - 1 Peter 4:10
      - Ephesians 4:16
      - Colossians 2:5, 6, 19
      - 1 Corinthians 12:12 ff
- Chapter: '36'
  Title: Article XXXVI
  Sections:
  - Section: '1'
    Content: |-
      That being thus joined, every Church has power given them from Christ for their better well-being, to choose to themselves fitting persons into the office of Pastors, Teachers, Elders, Deacons, being qualified according to the Word, as those which Christ has appointed in His Testament, for the feeding, governing, serving, and building up of His Church, and that none other have to power to impose them, either these or any other.

      *Proofs:*
      - Acts 1:2
      - Acts 6:3
      - Acts 15:22, 25
      - 1 Corinthians 16:3
      - Romans 12:7, 8
      - Romans 16:1
      - 1 Corinthians 12:8, 28
      - 1 Timothy 3 chapt.
      - Hebrews 13:7
      - 1 Peter 5:1-3
- Chapter: '37'
  Title: Article XXXVII
  Sections:
  - Section: '1'
    Content: |-
      That the Ministers aforesaid, lawfully called by the Church, where they are to administer, ought to continue is their calling, according to God's ordinance, and carefully to feed the flock of Christ committed to them, nor for filthy lucre, but of a ready mind.

      *Proofs:*
      - Hebrews 5:4
      - Acts 4:23
      - 1 Timothy 4:14
      - John 10:3, 4
      - Acts 20:28
      - Romans 12:7, 8
      - Hebrews 13:7, 17
- Chapter: '38'
  Title: Article XXXVIII
  Sections:
  - Section: '1'
    Content: |-
      That the due maintenance of the officers aforesaid, should be the free and voluntary communication of the Church, that according to Christ's ordinance, they that preach the Gospel, should live on the Gospel and not by constraint to be compelled from the people by a forced law.

      *Proofs:*
      - 1 Corinthians 9:7, 14
      - Galatians 6:6
      - 1 Thessalonians 5:13
      - 1 Timothy 5:17-18
      - Philippians 4:15-16
- Chapter: '39'
  Title: Article XXXIX
  Sections:
  - Section: '1'
    Content: |-
      That Baptism is an ordinance of the New Testament, given by Christ, to be dispensed only upon persons professing faith, or that are Disciples, or taught, who upon a profession of faith, ought to be baptized (Added later: "...and after to partake of the Lord's Supper.")

      *Proofs:*
      - Acts 2:37, 38
      - Acts 8:36-38
      - Acts 18:8
- Chapter: '40'
  Title: Article XL
  Sections:
  - Section: '1'
    Content: |-
      The way and manner of the dispensing of this ordinance the Scripture holds out to be dipping or plunging the whole body under water: it being a sign, must answer the thing signified, which are these: first, the washing the whole soul in the blood of Christ; secondly, that interest the saints have in death, burial, and resurrection (of Christ) ; thirdly, together with a confirmation of out faith, that as certainly as the body is buried under water, and rises again, so certainly shall the bodies of the saints by raised by the power of Christ, in the day of the resurrection, to reign with Christ.

      *Proofs:*
      - Matthew 3:16
      - John 3:23
      - Acts 8:38
      - Revelation 1:5
      - Revelation 7:14
      - Hebrews 10:22
      - Romans 6:3-5
      - 1 Corinthians 15:28, 29
- Chapter: '41'
  Title: Article XLI
  Sections:
  - Section: '1'
    Content: |-
      The persons designed by Christ, to dispense this ordinance, the Scriptures hold forth to a preaching Disciple, it being no where tied to a particular church, officer, or person extraordinarily sent, the commission enjoining the administration, being given to them under no other consideration, but as considered Disciples.

      *Proofs:*
      - Isaiah 8:16
      - Matthew 28:16-19
      - John 4:1-2
      - Acts 20:7
      - Matthew 26:26
- Chapter: '42'
  Title: Article XLII
  Sections:
  - Section: '1'
    Content: |-
      Christ has likewise given power to His whole church to receive in and cast out, by way of Excommunication, any member; and this power is given to every particular congregation, and not one particular person, either member or officer, but the whole.

      *Proofs:*
      - Acts 2:47
      - Romans 16:2
      - Matthew 18:17
      - 1 Corinthians 5:4
      - 2 Corinthians 2:6-8
- Chapter: '43'
  Title: Article XLIII
  Sections:
  - Section: '1'
    Content: |-
      And every particular member of each Church how excellent, great, or learned soever, ought to be subject to this censor and judgment of Christ; and the church ought with great care and tenderness, with due advise to proceed against her members.

      *Proofs:*
      - Matthew 18:16-18
      - Acts 11:2. 3
      - 1 Timothy 5:19-21
- Chapter: '44'
  Title: Article XLIV
  Sections:
  - Section: '1'
    Content: |-
      And as Christ for the keeping of this church in holy and orderly communion, places some special men over the church, who by their office are to govern, oversee, visit, watch; so likewise for the better keeping thereof in all places, by the members, He has given authority, and laid duty upon all, to watch over one another.

      *Proofs:*
      - Acts 20:27, 28
      - Hebrews 13:17, 24
      - Matthew 24:25
      - 1 Thessalonians 5:14
      - Mark 13:34, 37
      - Galatians 6:1
      - 1 Thessalonians 5:11
      - Jude 1:3, 20
      - Hebrews 10:34-35
      - Hebrews 12:15
- Chapter: '45'
  Title: Article XLV
  Sections:
  - Section: '1'
    Content: |-
      That also such to whom God has given gifts, being tried in the church, may and ought by the appointment of the congregation, to prophesy, according to the proportion of faith, and so teach publicly the Word of God, for the edification, exhortation, and comfort of the Church.

      *Proofs:*
      - 1 Corinthians 14 chapter
      - Romans 12:6
      - 1 Peter 4:10-11
      - 1 Corinthians 12:7
      - 1 Thessalonians 5:17-19
- Chapter: '46'
  Title: Article XLVI
  Sections:
  - Section: '1'
    Content: |-
      Thus being rightly gathered, established, and still proceeding in Christian communion, and obedience of the Gospel of Christ, none ought to separate for faults and corruptions, which may, and as long as the church consists of men subject to failings, will fall out and arise amongst them, even in true constituted churches, until they have in due order sought redress thereof.

      *Proofs:*
      - Revelation 2, 3 chapters
      - Acts 15:12
      - 1 Corinthians 1:10
      - Ephesians 2:16
      - Ephesians 3:15-16
      - Hebrews 10:25
      - Jude 1:15
      - Matthew 18:17
      - 1 Corinthians 5:4, 5
- Chapter: '47'
  Title: Article XLVII
  Sections:
  - Section: '1'
    Content: |-
      And although the particular congregation be distinct and several bodies, every one a compact and knit city in itself; yet are they all to walk by one and the same Rule, and by all means convenient to have the counsel and help one of another in all needful affairs of the church, as members of one body in the common faith under Christ their only Head.

      *Proofs:*
      - 1 Corinthians 4:17
      - 1 Corinthians 14:33, 36
      - 1 Corinthians 16:1
      - Matthew 28:20
      - 1 Timothy 3:15
      - 1 Timothy 6:13-14
      - Revelation 22:18-19
      - Colossians 2:6, 19
      - Colossians 4:16
- Chapter: '48'
  Title: Article XLVIII
  Sections:
  - Section: '1'
    Content: |-
      That a civil magistrate is an ordinance of God set up by God for the punishment of evil doers, and for the praise of them that do well; and that all lawful things commanded by them, subjection ought to be given by us in the Lord: and that we are to make supplication and prayer for Kings, and all that are in authority, that under them we may live a peaceable and quiet life in all godliness and honesty.

      *Proofs:*
      - Romans 13:1-4
      - 1 Peter 2:13, 14
      - 1 Timothy 2:2
- Chapter: '49'
  Title: Article XLIX
  Sections:
  - Section: '1'
    Content: |-
      The supreme Magistrate of this Kingdom we believe to be the King and Parliament freely chosen by the Kingdom, and that in all those civil laws which have been acted by them, or for the present is or shall by ordained, we are bound to yield subjection and obedience unto in the Lord, as conceiving our selves bound to defend both the persons of those chosen, and all civil laws made by them, with our persons, liberties, and estates, with all that is called ours, although we should suffer never so much from them in not actively submitting to some ecclesiastical laws, which might be conceived by them to be their duties to establish which we for the present could not see, nor our consciences could submit unto; yet are we bound to yield our persons to their pleasures.
- Chapter: '50'
  Title: Article L
  Sections:
  - Section: '1'
    Content: |-
      And if God should provide such a mercy for us, as to incline the magistrates hearts so far to tender our consciences, as that we might be protected by them from wrong, injury, oppression and molestation, which long we formerly have groaned under by the tyranny and oppression of the Prelatical Hierarchy, which God through mercy has made this present King and Parliament wonderful honorable; as an instrument is His hand, to throw down; and we thereby have had some breathing time, we shall, we hope, look at it as a mercy beyond our expectation, and conceive ourselves further engaged for ever to bless God for it.

      *Proofs:*
      - 1 Timothy 1:2-4
      - Psalms 126:1
      - Acts 9:31
- Chapter: '51'
  Title: Article LI
  Sections:
  - Section: '1'
    Content: |-
      But if God with hold the magistrates allowance and furtherance herein; yet we must not withstanding proceed together in Christian communion, not daring to give place to suspend our practice, but to walk in obedience to Christ in the profession and holding forth this faith before mentioned, even in the midst of all trails and afflictions, not accounting out goods, lands, wives, husbands, children, fathers, mothers, brethren, sisters, yea, and our own lives dear unto us, so we may finish our course with joy: remembering always we ought to obey God rather then men, and grounding upon the commandment, commission, and promise of our Lord and Master Jesus Christ, who as He has power in heaven and earth, so also has promised, if we keep His commandments which He has given us, to be with us to the end of the world: and when we have finished our course, and kept the faith, to give us the crown of righteousness, which is laid up for all that love His appearing, and to whom we must give an account of all our actions, no man being able to discharge us of the same.

      *Proofs:*
      - Acts 2:40, 41
      - Acts 4:19
      - Acts 5:28, 29, 41
      - Acts 20:23
      - 1 Thessalonians 3:3
      - Philippians 1:27-29
      - Daniel 3:16, 17
      - Daniel 6:7, 10, 22, 23.
      - Matthew 28:18-20
      - 1 Timothy 6:13-15
      - Romans 12:1.8
      - 1 Corinthians 14:37
      - 2 Timothy 4:7, 8
      - Revelation 2:10
      - Galatians 2:4, 5
- Chapter: '52'
  Title: Article LII
  Sections:
  - Section: '1'
    Content: |-
      And likewise unto all men is to be given whatsoever is their due; tributes, customs, and all such lawful duties, ought willingly to be by us paid and performed, our lands, goods, and bodies, to submit to the magistrate in the Lord, and the magistrate every way to be acknowledged, reverenced, and obeyed, according to godliness; not because of wrath only but for conscience sake. And finally, all men so to be esteemed and regarded, as is due and appropriate for their place, age, estate, and condition.

      *Proofs:*
      - Romans 13:5-7
      - Matthew 22:21
      - Titus 3
      - 1 Peter 3:13
      - 1 Peter 5:5
      - Ephesians 5:21, 22
      - Ephesians 6:1, 9
- Chapter: '53'
  Title: Article LIII
  Sections:
  - Section: '1'
    Content: |-
      And thus we desire to give God that which is God's, and unto Ceasor that which is Ceasor's, and unto all men that which belongs unto them, endeavoring ourselves to have always a clear conscience void of offense towards God, and towards man. And if they take this that we have said, to be heresy, then do we with the Apostle freely confess, that after the way which they call heresy, worship we the God of our Fathers, believing all things which are written in the Law and in the Prophets and Apostles, desiring from our souls to disclaim all heresies and opinions which are not after Christ, and to be steadfast, unmovable, always abounding in the work of the Lord, as knowing our labor shall not be in vain in the Lord.

      *Proofs:*
      - Matthew 22:21
      - Acts 24:14-16
      - John 5:28
      - 2 Corinthians 4:17
      - 1 Timothy 6:3-5
      - 1 Corinthians 15:58, 59
- Chapter: C
  Title: onclusion
  Sections:
  - Section: '1'
    Content: |-
      Thus we desire to give unto Christ that which is His, and unto all lawful Authority that which is their due, and to owe nothing to any many but love, to live quietly and peaceably, at is becometh saints, endeavoring in all things to keep a good conscience, and to do unto every man (of what judgment soever) as we would they should do unto us, that as our practice is, so it may prove us to a conscionable, quiet, and harmless people, (no ways dangerous or troublesome to human Society) and to labor and work with our hands, that we may not be chargeable to any, but to give to him that needeth both friends and enemies, accounting it more excellent to give than to receive. Also we confess that we know but in part, and that we are ignorant of many things which we desire and seek to know: and if any do show us that friendly part to show us from the Word of God that we see not, we shall have cause to be thankful to God and them. But if any man shall impose upon us anything that we see not to be commanded by out Lord Jesus Christ, we should in His strength, rather embrace all reproaches and tortures of men, to be stript of all outward comforts, and if it were possible, to die a thousand deaths, rather than to do anything against the least tittle of the truth of God, or against the light of our own consciences. And if any shall call what we have said heresy, then do we with the Apostle acknowledge, that after the way they call heresy, worship we the God of our Fathers, disclaiming all heresy (rightly so called) because they are against Christ, and to be steadfast and immovable, always abounding in obedience to Christ, as knowing our labor shall not be in vain in the Lord.

      1 Corinthians 1:24 Not that we have dominion over your faith,but

      are helpers of your joy: for by faith we stand.

      Psalms 74:21, 22 Arise, O God, plead mine own cause. Remember how the foolish man blasphemeth Thee daily. O let not the oppressed return ashamed, but let the poor and needy praise Thy name.

      Come, Lord Jesus, come quickly.
